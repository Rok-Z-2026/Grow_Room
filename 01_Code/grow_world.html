<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TINY GROW</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{height:100%;background:#0a0d0a;overflow:hidden;font-family:system-ui,sans-serif}
#app{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;background:linear-gradient(180deg,#90b8d4 0%,#a6c897 32%,#52762f 100%);overflow:hidden;touch-action:none}
#iso{display:block;width:100%;height:100%}
.topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;background:rgba(8,12,8,.85);border:1px solid #3a4a2a;border-radius:14px;padding:9px 14px;z-index:6}
.coin{color:#ffcf4d;font-weight:800;font-size:20px;text-shadow:0 1px 2px #000}.coin::before{content:"💰 "}.spacer{flex:1}.tag{color:#8fd96f;font-size:12px}
.zoombtns{position:absolute;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:6}.zoombtns button{width:42px;height:42px;border-radius:11px;border:1.5px solid #6fc04d;background:rgba(20,40,15,.85);color:#eaffea;font-size:22px;font-weight:800}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#eaffd0;font-size:11px;font-style:italic;text-shadow:0 1px 3px #000;pointer-events:none;z-index:5}
.float{position:absolute;color:#ffe87a;font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 6px #000,0 0 12px rgba(255,200,60,.6);z-index:7;opacity:1;transform:translate(-50%,0) scale(0.3);animation:floatpop 1.1s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
@keyframes floatpop{0%{transform:translate(-50%,0) scale(0.3);opacity:0}18%{transform:translate(-50%,-12px) scale(1.25);opacity:1}35%{transform:translate(-50%,-20px) scale(1)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.coin.pulse{animation:coinpulse .4s ease-out}
@keyframes coinpulse{0%{transform:scale(1)}40%{transform:scale(1.28);color:#ffe87a}100%{transform:scale(1)}}
.seedbar{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;max-height:calc(100dvh - 60px);overflow-y:auto;background:linear-gradient(180deg,rgba(20,28,18,0.0),rgba(16,22,14,0.96) 22%);padding:12px 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:30;}
.seedbar.show{transform:translateY(0);}
.seedtitle{color:#e8f5d8;font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;text-shadow:0 1px 3px #000;}
.seeds{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;}
.seed{flex:1 1 0;min-width:0;max-width:88px;background:linear-gradient(180deg,#33402a,#222c1c);border:1.5px solid #4a5c38;border-radius:14px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .12s,border-color .12s;}
.seed:active{transform:scale(0.94);}
.seed.sel{border-color:#9dffb8;box-shadow:0 0 0 2px rgba(157,255,184,0.4),0 3px 8px rgba(0,0,0,0.4);}
.seed .ico{font-size:24px;line-height:1;}
.seed .nm{font-size:10px;color:#cfe6bd;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.stock{margin-left:10px;background:rgba(40,60,30,0.6);border:1px solid #4a6c38;border-radius:12px;padding:3px 10px;color:#cfe6bd;font-size:14px;}
.stock b{color:#9dffb8;}
.sellbar{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#2a3a22,#1c2716);border:1.5px solid #4a6c38;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(0,0,0,0.5);transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:25;}
.sellbar.show{transform:translateY(0);}
.sellinfo{flex:1;display:flex;flex-direction:column;gap:2px;}
.selllabel{color:#cfe6bd;font-size:13px;}
.sellprice{color:#ffe87a;font-weight:800;font-size:18px;}
.sellbtn{background:linear-gradient(180deg,#ffd84d,#f0a820);color:#3a2810;font-weight:800;font-size:15px;border:none;border-radius:14px;padding:12px 20px;cursor:pointer;box-shadow:0 3px 0 #c88410,0 4px 10px rgba(0,0,0,.4);transition:transform .1s;}
.sellbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c88410;}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%) translateY(-20px);background:rgba(20,28,16,0.95);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;border:1px solid #4a6c38;opacity:0;pointer-events:none;transition:all .3s;z-index:40;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.carebar{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;max-height:calc(100dvh - 60px);overflow-y:auto;background:linear-gradient(180deg,rgba(20,28,18,0.0),rgba(16,22,14,0.96) 22%);padding:12px 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:31;}
.carebar.show{transform:translateY(0);}
.caretitle{color:#e8f5d8;font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;text-shadow:0 1px 3px #000;}
.cares{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;}
.care{position:relative;flex:1 1 0;min-width:0;max-width:110px;background:linear-gradient(180deg,#33402a,#222c1c);border:1.5px solid #4a5c38;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .1s;}
.care:active{transform:scale(0.92);}
.care .cico{font-size:26px;}
.care .cnm{font-size:11px;color:#cfe6bd;font-weight:500;}
.care .cstk{position:absolute;top:-7px;right:-5px;background:#ffd84d;color:#3a2810;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;border:2px solid #1c2716;}
/* ecrans courts (paysage): UI plus compacte pour que les barres du bas tiennent */
@media (max-height:430px){
  .seedtitle,.caretitle{margin-bottom:5px;font-size:13px;}
  .seedbar,.carebar{padding-top:8px;}
  .seed{padding:5px 3px;border-radius:11px;}.seed .ico{font-size:19px;}.seed .nm{font-size:9px;}
  .care{padding:6px 4px;}.care .cico{font-size:20px;}.care .cnm{font-size:9px;}
}
/* tres large (desktop/tablette paysage): limite la largeur des cartes centrees */
@media (min-width:900px){ .seeds,.cares{max-width:760px;margin:0 auto;} }

.labbtn{position:absolute;right:14px;top:min(340px,46vh);width:64px;height:64px;border-radius:18px;background:linear-gradient(180deg,#3a4a2c,#26341c);border:2px solid #5a7038;font-size:30px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:20;}
.labbtn:active{transform:scale(0.94);}
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.modal.show{display:flex;}
.modalbox{width:100%;max-width:480px;background:linear-gradient(180deg,#2a3a22,#1a2414);border-radius:24px 24px 0 0;border-top:2px solid #4a6c38;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:75%;overflow-y:auto;animation:slideup .3s cubic-bezier(.2,.8,.3,1);}

.modalhead{display:flex;justify-content:space-between;align-items:center;color:#e8f5d8;font-size:19px;font-weight:800;margin-bottom:16px;}
.modalx{background:rgba(255,255,255,0.1);border:none;color:#cfe6bd;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;}
.lablist{display:flex;flex-direction:column;gap:12px;}
.labitem{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#33402a,#222c1c);border:1.5px solid #4a5c38;border-radius:16px;padding:12px;}
.labemo{font-size:34px;}
.labinfo{flex:1;}
.labname{color:#e8f5d8;font-weight:700;font-size:15px;}
.labdesc{color:#9cb888;font-size:12px;margin-top:2px;}
.lablvl{color:#7dd87d;font-size:12px;margin-top:3px;}
.labbuy{background:linear-gradient(180deg,#ffd84d,#f0a820);color:#3a2810;font-weight:800;font-size:13px;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 #c88410;white-space:nowrap;}
.labbuy:active{transform:translateY(2px);box-shadow:0 1px 0 #c88410;}
.labbuy:disabled{background:#555;color:#999;box-shadow:0 3px 0 #333;cursor:default;}

":5,"cost":3500,"owned":false},{"gx":57,"gy":44,"gw":8,"gh":5,"cost":5500,"owned":false},{"gx":22,"gy":60,"gw":8,"gh":5,"cost":8000,"owned":false},{"gx":44,"gy":34,"gw":8,"gh":5,"cost":12000,"owned":false},{"gx":54,"gy":36,"gw":8,"gh":5,"cost":18000,"owned":false}]};</script>
<script>
const IMG={};let nn=PACK.length,gg=0,ready=false;
for(const k of PACK){const im=new Image();im.onload=im.onerror=()=>{if(++gg>=nn)ready=true;};im.src=ASSET_BASE+k+".png";IMG[k]=im;}
const cv=document.getElementById('iso'),ctx=cv.getContext('2d');
let APP_W=440,APP_H=873,DPR=Math.min(2,window.devicePixelRatio||2);
function resize(){const a=document.getElementById('app');APP_W=a.clientWidth;APP_H=a.clientHeight;cv.width=APP_W*DPR;cv.height=APP_H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
function onResize(){resize();clampCam();}  // recadre la vue a chaque changement d'ecran/orientation
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(onResize,120);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
resize();

const W=WORLD,MW=W.MW,MH=W.MH;
const TW0=64,TH0=32,EH0=26; let zoom=0.7;
function TW(){return TW0*zoom;}function TH(){return TH0*zoom;}function EH(){return EH0*zoom;}
let cam={x:0,y:0},coin=300,stock=0,marketPrice=8;  // stock en grammes, prix/g
let boosts={water:20,sun:15,nute:10};  // stocks de soins limités
let combo={count:0,last:0,window:1200};  // système de combo
let lab={yield:0,speed:0,value:0};  // niveaux des améliorations labo
let selCell=null;  // cellule selectionnee — DECLAREE AVANT draw() (draw() la lit ligne ~305). Sinon TDZ: le 1er draw() synchrone throw si une parcelle est visible frame 1 -> boucle rAF morte -> canvas blanc.
const LAB=[
  {key:'yield',name:'Rendement',emo:'🌿',base:120,mul:1.6,max:20,desc:'+25% grammes'},
  {key:'speed',name:'Vitesse',emo:'⚡',base:150,mul:1.7,max:15,desc:'-8% temps de pousse'},
  {key:'value',name:'Valeur',emo:'💎',base:180,mul:1.65,max:20,desc:'+20% prix de vente'},
];
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function labCost(u){return Math.floor(u.base*Math.pow(u.mul,lab[u.key]));}
function yieldMult(){return 1+lab.yield*0.25;}
function speedMult(){return Math.pow(0.92,lab.speed);}  // <1 = plus rapide
function valueMult(){return 1+lab.value*0.20;}
const H=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y);return(ix>=0&&iy>=0&&ix<MW&&iy<MH)?W.hgt[iy][ix]:0;};

const cropCells={};
function rebuildCrop(){for(const z of W.cropzones){if(!z.owned)continue;for(let dy=0;dy<z.n;dy++)for(let dx=0;dx<z.n;dx++){const x=z.zx+dx,y=z.zy+dy,k=x+','+y;if(!cropCells[k])cropCells[k]={x,y,state:'empty',grow:0,variety:0};}}}
rebuildCrop();

function isoX(c,r){return APP_W/2+(c-r)*TW()/2+cam.x;}
var particles=[];
function burst(px,py,color,n){for(var i=0;i<(n||14);i++){var a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5;particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col:color||'#ffe87a',sz:2+Math.random()*3});}}
function updateParticles(){for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.96;p.life-=0.025;}particles=particles.filter(function(p){return p.life>0;});}
function drawParticles(){ctx.save();for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill();}ctx.restore();}
function isoYb(c,r){return APP_H*0.28+(c+r)*TH()/2+cam.y;}      // sol niveau 0
function isoY(c,r){return isoYb(c,r)-H(c,r)*EH();}              // avec hauteur
function setCoin(v){coin=v;document.getElementById('coin').textContent=Math.floor(coin).toLocaleString('fr-FR');}
setCoin(coin);

// dessine une tuile sol losange (clip + texture carree seamless)
function tile(sqKey,c,r){const img=IMG[sqKey];if(!img||!img.complete||!img.naturalWidth)return;
  const x=isoX(c+0.5,r+0.5),y=isoY(c+0.5,r+0.5);const w=TW(),h=TH();
  // CLIP losange iso exact : coupe le debord aux aretes -> zero chevauchement,
  // motif des paves non deforme (ratio image conserve).
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x-w/2,y);ctx.closePath();
  ctx.clip();
  const ow=w*1.12,oh=ow*(img.naturalHeight/img.naturalWidth);
  ctx.drawImage(img,x-ow/2,y-oh/2,ow,oh);
  ctx.restore();}

// parois: pour une case de hauteur h, dessine les faces gauche/droite visibles
// si le voisin (en avant a l'ecran) est plus bas.
function walls(c,r){
  const h=H(c,r);if(h<=0)return;
  const x=isoX(c+0.5,r+0.5),yT=isoY(c+0.5,r+0.5);
  const w=TW(),th=TH();
  const img=IMG['wallTex'];if(!img||!img.complete)return;
  // hauteur de chute = difference avec le voisin le plus bas en avant (SE=x, SW=y)
  const dE=h-H(c+1,r), dS=h-H(c,r+1);
  const B=[x,yT+th/2],L=[x-w/2,yT],R=[x+w/2,yT];
  function face(p1,p2,drop,sh){
    if(drop<=0)return;const H2=drop*EH();
    ctx.save();
    // parallelogramme exact de la face (suit l'arete iso, pas de marche)
    ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p2[0],p2[1]+H2);ctx.lineTo(p1[0],p1[1]+H2);ctx.closePath();
    ctx.clip();
    const x0=Math.min(p1[0],p2[0]),x1=Math.max(p1[0],p2[0]),ww=(x1-x0)||w/2;
    // texture repetee verticalement
    let yy=Math.min(p1[1],p2[1])-th; const yend=Math.max(p1[1],p2[1])+H2+th;
    while(yy<yend){ctx.drawImage(img,x0,yy,ww,th*2.2);yy+=th*2;}
    // ombrage DANS le clip (suit la forme, pas de rectangle qui deborde)
    ctx.fillStyle='rgba(10,16,8,'+sh+')';ctx.fill();
    ctx.restore();
  }
  // face droite (vers SE, voisin x+1) et face gauche (vers SW, voisin y+1)
  face(B,R,dE,0.16);   // droite
  face(L,B,dS,0.32);   // gauche (plus sombre)
}

function drawSp(img,cx,cyB,tw,a){if(!img||!img.complete||!img.naturalWidth)return;const r=img.naturalHeight/img.naturalWidth;if(a!=null){ctx.save();ctx.globalAlpha=a;ctx.drawImage(img,cx-tw/2,cyB-tw*r,tw,tw*r);ctx.restore();}else ctx.drawImage(img,cx-tw/2,cyB-tw*r,tw,tw*r);}

// dessine un sprite qui se balance dans le vent : la BASE reste ancree (cx,cyB),
// le HAUT penche horizontalement selon le temps. amp = amplitude du balancement.
function drawSpWind(img,cx,cyB,tw,amp,phase){
  if(!img||!img.complete||!img.naturalWidth)return;
  const r=img.naturalHeight/img.naturalWidth, th=tw*r;
  const T=performance.now()/1000;
  // brise principale lente + micro-frisson rapide, dephase par objet
  const sway=Math.sin(T*0.9+phase)*amp + Math.sin(T*2.7+phase*1.7)*amp*0.25;
  ctx.save();
  ctx.translate(cx,cyB);          // origine = pied du sprite
  ctx.transform(1,0,sway,1,0,0);  // skew horizontal : le haut se decale, le bas non
  ctx.drawImage(img,-tw/2,-th,tw,th);
  ctx.restore();
}


// ombre portee elliptique au sol sous un element
function shadow(cx,cyB,w){
  // ombre douce et compacte : sous le pied, pas trop grande -> du relief sans grosse tache
  ctx.save();
  ctx.globalAlpha=0.30;ctx.fillStyle='#16210d';
  ctx.beginPath();ctx.ellipse(cx,cyB,w*0.38,w*0.15,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function decImg(d){const[t,v]=d;if(['tree','treeC','bush','bushF','flower','rock','stump'].includes(t))return t+v;return t;}
function decScale(t){if(t.startsWith('rocriv'))return 6.0;if(t.startsWith('pont'))return 3.2;if(t==='pond_big'||t==='pond_mare'||t==='cascade')return 2.6;if(t==='house5')return 1.35;if(['house1','house2','house3','house4','cabin','atelier1'].includes(t))return 2.2;if(t.startsWith('serre'))return 2.0;if(t==='watertower')return 1.6;if(t==='forge')return 1.5;if(t==='well')return 1.0;if(t==='fountain')return 1.1;if(t==='tree'||t==='treeC')return 1.5;if(t==='rock')return 1.1;return 0.95;}
function isBig(t){return t.startsWith('house')||t.startsWith('serre')||t==='tree'||t==='treeC'||t==='cabin'||t==='atelier1'||t==='watertower'||t==='forge';}
function clampCam(){
  const xs=[isoX(0,0)-cam.x,isoX(MW,0)-cam.x,isoX(0,MH)-cam.x,isoX(MW,MH)-cam.x];
  const ys=[isoYb(0,0)-cam.y,isoYb(MW,0)-cam.y,isoYb(0,MH)-cam.y,isoYb(MW,MH)-cam.y];
  const wm=Math.min(...xs),wM=Math.max(...xs),hm=Math.min(...ys)-2*EH(),hM=Math.max(...ys);
  const maxX=-wm,minX=APP_W-wM,maxY=-hm,minY=APP_H-hM;
  cam.x=minX<maxX?Math.min(maxX,Math.max(minX,cam.x)):(maxX+minX)/2;
  cam.y=minY<maxY?Math.min(maxY,Math.max(minY,cam.y)):(maxY+minY)/2;
}
(function(){const cx=MW/2,cy=MH/2;cam.x=-(cx-cy)*TW()/2;cam.y=APP_H*0.5-APP_H*0.28-(cx+cy)*TH()/2;clampCam();})();
function vis(x,y){const sx=isoX(x+0.5,y+0.5),sy=isoY(x+0.5,y+0.5);return sx>-TW()*3&&sx<APP_W+TW()*3&&sy>-TH()*12&&sy<APP_H+TH()*6;}

function groundKey(g){return g==='path'?'sq_path':g==='grass'?'sq_grass':g==='dirt'?'sq_dirt':g==='sand'?'sq_sand':g==='moss'?'sq_moss':g==='gravel'?'sq_gravel':g==='pavel'?'sq_stone':g==='soil'?'sq_soil':g==='mud'?'sq_mud':g==='water'?'sq_grass':'sq_grass';}

function zoneCost(){const o=W.cropzones.filter(z=>z.owned).length;return Math.floor(300*Math.pow(1.7,o-1));}
// une parcelle n'est visible/achetable que si sa clairiere (landgroup) est defrichee
function zoneAvailable(z){if(z.group==null||z.group<0)return true;const g=W.landgroups&&W.landgroups[z.group];return !!(g&&g.owned);}

var NIGHT=0.32;   // assombrissement global (ambiance Mystic Nature)
function draw(){
  ctx.clearRect(0,0,APP_W,APP_H);
  // tri de toutes les cases par profondeur (c+r), avec hauteur prise en compte dans le rendu
  const cells=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(vis(x,y))cells.push({x,y,d:x+y});}
  cells.sort((a,b)=>a.d-b.d);
    for(const {x,y} of cells){
    // 1) parois sous la case
    walls(x,y);
    // 2) sol (ou rampe)
    const rk=W.ramps[y][x];
    if(rk){
      tile(groundKey(W.ground[y][x]),x,y);
      const img=IMG['ramp_'+rk]||IMG[rk];
      const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      const w=TW()*1.55,hh=(img&&img.naturalWidth?img.naturalHeight/img.naturalWidth:0.8)*w;
      // calage specifique selon l'orientation de la rampe
      // stoneNE descend vers SW (gauche), stoneNW descend vers SE (droite)
      let offX=0, offY=0;
      if(rk==='stoneNE'){ offX=-TW()*0.18; offY=EH()*0.10; }      // gauche: ok, leger ajust
      else if(rk==='stoneNW'){ offX=TW()*0.18; offY=-EH()*0.30; } // droite: remonter moins (etait trop haute)
      if(img)ctx.drawImage(img, ix-w/2+offX, iy+TH()*0.5-hh+offY, w, hh);
    } else {
      const g=W.ground[y][x];
      tile(groundKey(g),x,y);
      if(g==='water'){const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5),w=TW()*1.35,hh=TH()*1.35;
      const T=performance.now()/1000;
      ctx.save();ctx.beginPath();ctx.moveTo(ix,iy-hh/2);ctx.lineTo(ix+w/2,iy);ctx.lineTo(ix,iy+hh/2);ctx.lineTo(ix-w/2,iy);ctx.closePath();ctx.clip();
      // 1) degrade de profondeur : turquoise clair en haut -> bleu profond en bas
      const grd=ctx.createLinearGradient(ix,iy-hh/2,ix,iy+hh/2);
      grd.addColorStop(0,'#6fd0c4');grd.addColorStop(0.5,'#3fa89a');grd.addColorStop(1,'#256b66');
      ctx.fillStyle=grd;ctx.fillRect(ix-w,iy-hh*2,w*2,hh*4);
      // 2) ANIMATION : cycle des 4 frames d'eau avec fondu enchaine -> surface qui ondule en continu
      const fps=2.2;                      // vitesse du cycle (frames/sec)
      const cellPhase=((x*7+y*13)%10)/10; // decalage par case -> casse la repetition du motif
      const fT=T*fps+cellPhase;
      const cur=Math.floor(fT)%4, nxt=(cur+1)%4, blend=fT-Math.floor(fT);
      const f1=IMG['water_f'+cur], f2=IMG['water_f'+nxt];
      // leger decalage de la texture par case (variation spatiale du motif)
      const ox=((x*37+y*19)%24)-12, oy=((x*23+y*41)%24)-12;
      const dw=w*1.5,dh=hh*1.5,dx=ix-w*0.75+ox,dy=iy-hh*0.75+oy;
      if(f1&&f1.complete&&f1.naturalWidth){ctx.globalAlpha=0.78;ctx.drawImage(f1,dx,dy,dw,dh);}
      if(f2&&f2.complete&&f2.naturalWidth){ctx.globalAlpha=0.78*blend;ctx.drawImage(f2,dx,dy,dw,dh);}
      ctx.globalAlpha=1;
      ctx.restore();}
    }
    }
  // PASSE EAU : APRES le sol, AVANT ombres/objets -> mares/lacs poses sur le sol
  // et TOUJOURS sous les arbres/batiments (dessines ensuite dans la passe objets).
  for(const {x,y} of cells){
    const dec=W.decor[y][x];
    if(dec && ['pond_big','pond_mare','cascade'].includes(dec[0])){
      const t=dec[0],img=decImg(dec),sc=decScale(t);const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      drawSp(IMG[img],ix,iy+TH()*0.85,TW()*sc);}
  }
  // PASSE OMBRES : APRES tout le sol, AVANT les objets -> l'ombre se pose sur le terrain
  for(const {x,y} of cells){
    const dec=W.decor[y][x];
    if(dec && ['tree','treeC'].includes(dec[0])){const t=dec[0],sc=decScale(t);const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);shadow(ix,iy+TH()*0.58,TW()*sc*0.85);}
  }
  // PASSE OBJETS
  for(const {x,y} of cells){
    const dec=W.decor[y][x];
    if(dec && !['pond_big','pond_mare','cascade'].includes(dec[0])){const t=dec[0],img=decImg(dec),sc=decScale(t);const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      let a=null;if(isBig(t)&&zoom>0.95){for(const kk in cropCells){const c=cropCells[kk];if(c.state==='ready'&&(c.x+c.y)>(x+y)&&Math.abs(isoX(c.x+.5,c.y+.5)-ix)<TW()&&isoY(c.x+.5,c.y+.5)>iy-TH()*3&&isoY(c.x+.5,c.y+.5)<iy+TH()){a=0.45;break;}}}
      // effet vent : seuls les vegetaux se balancent (arbres/buissons/fleurs), pas les structures
      const wind=['tree','treeC','bush','bushF','flower'].includes(t);
      if(wind && a==null){
        const amp=(t==='flower'?0.10:t==='bush'||t==='bushF'?0.055:0.035); // fleurs souples, arbres raides
        drawSpWind(IMG[img],ix,iy+TH()*0.62,TW()*sc,amp,(x*1.3+y*0.7));
      } else {
        drawSp(IMG[img],ix,iy+TH()*0.85,TW()*sc,a);
      }}
    // 4) crop
    const ck=x+','+y;if(cropCells[ck]){const c=cropCells[ck];const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      let pk=c.state==='growing'?(c.grow<0.15?'parc3':'parc2'):c.state==='ready'?'parc4':'parc1';
      drawSp(IMG[pk],ix,iy+TH(),TW()*1.3);
      // surbrillance de la case selectionnee (cadre lumineux pulse)
      if(selCell===c){const w=TW(),hh=TH();const pulse=0.5+0.5*Math.sin(performance.now()/300);
        ctx.save();ctx.beginPath();ctx.moveTo(ix,iy-hh/2);ctx.lineTo(ix+w/2,iy);ctx.lineTo(ix,iy+hh/2);ctx.lineTo(ix-w/2,iy);ctx.closePath();
        ctx.fillStyle='rgba(157,255,184,'+(0.12+0.12*pulse)+')';ctx.fill();
        ctx.lineWidth=2.5;ctx.strokeStyle='rgba(157,255,184,'+(0.6+0.4*pulse)+')';ctx.stroke();ctx.restore();}
      if(c.state!=='empty'){const v=['v','p','b','o','n','a'][c.variety];const st=c.state==='ready'?8:Math.max(1,Math.min(8,Math.ceil(c.grow*8)));
        for(const[fc,fr]of[[0.30,0.30],[0.70,0.30],[0.30,0.70],[0.70,0.70]]){const sx=isoX(x+fc,y+fr),sy=isoY(x+fc,y+fr)+TH()*0.12;drawSp(IMG['plant_'+v+'_'+st],sx,sy,TW()*(0.28+0.20*(st/8)));}
        // barre de progression ARRONDIE avec degrade + reflet (pro)
        if(c.state==='growing'&&zoom>0.55){const bw=TW()*0.72,bh=7*zoom,bx=ix-bw/2,by=iy-TH()*1.15,rr=bh/2;
          function rrect(x,y,w,hh,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+hh,r);ctx.arcTo(x+w,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
          // ombre portee douce
          ctx.save();ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=4*zoom;ctx.shadowOffsetY=1.5*zoom;
          // fond sombre arrondi
          rrect(bx,by,bw,bh,rr);ctx.fillStyle='rgba(28,32,26,0.9)';ctx.fill();ctx.restore();
          // remplissage progression avec degrade vertical
          const g=Math.max(0.001,Math.min(1,c.grow));
          ctx.save();rrect(bx,by,bw*g,bh,rr);ctx.clip();
          const grd=ctx.createLinearGradient(bx,by,bx,by+bh);
          if(g<0.5){grd.addColorStop(0,'#a8e85a');grd.addColorStop(1,'#6cb22e');}
          else if(g<0.85){grd.addColorStop(0,'#d4f25c');grd.addColorStop(1,'#a8cc34');}
          else{grd.addColorStop(0,'#ffe87a');grd.addColorStop(1,'#f0b820');}
          ctx.fillStyle=grd;ctx.fillRect(bx,by,bw*g,bh);
          // reflet lumineux en haut (brillance)
          const gl=ctx.createLinearGradient(bx,by,bx,by+bh*0.5);
          gl.addColorStop(0,'rgba(255,255,255,0.55)');gl.addColorStop(1,'rgba(255,255,255,0)');
          ctx.fillStyle=gl;ctx.fillRect(bx,by,bw*g,bh*0.5);
          ctx.restore();}
        if(c.state==='ready'){const t=performance.now()/400;ctx.save();ctx.globalAlpha=.6+.4*Math.sin(t);ctx.font=(12*zoom)+'px serif';ctx.textAlign='center';ctx.fillText('✨',ix,iy-TH()*0.5);ctx.restore();}}}
  }
  // SHADER : assombrit tout le monde rendu (sous les labels/particules)
  ctx.save();ctx.fillStyle='rgba(12,16,30,'+NIGHT+')';ctx.fillRect(0,0,APP_W,APP_H);ctx.restore();
  // zones achetables (uniquement celles dont la clairiere est defrichee)
  for(const z of W.cropzones){if(z.owned||!zoneAvailable(z))continue;
    // 4 coins du losange (alignes sur les cellules: de zx a zx+n)
    // cadre cale EXACTEMENT sur les cellules du champ (sommets des cellules de bord)
    const hh=TH();
    const x0=isoX(z.zx+0.5,z.zy+0.5),y0=isoY(z.zx+0.5,z.zy+0.5)-hh/2;          // sommet Nord
    const x1=isoX(z.zx+z.n-0.5,z.zy+0.5),y1=isoY(z.zx+z.n-0.5,z.zy+0.5)-hh/2;  // Est (haut-droit)... 
    const x2=isoX(z.zx+z.n-0.5,z.zy+z.n-0.5),y2=isoY(z.zx+z.n-0.5,z.zy+z.n-0.5)+hh/2; // Sud
    const x3=isoX(z.zx+0.5,z.zy+z.n-0.5),y3=isoY(z.zx+0.5,z.zy+z.n-0.5)+hh/2;  // Ouest
    // pour un vrai losange englobant: utiliser les 4 coins extremes
    const nx=isoX(z.zx+0.5,z.zy+0.5),ny=isoY(z.zx+0.5,z.zy+0.5)-hh/2;
    const ex=isoX(z.zx+z.n-0.5,z.zy+0.5)+TW()/2,ey=isoY(z.zx+z.n-0.5,z.zy+0.5);
    const sx2=isoX(z.zx+z.n-0.5,z.zy+z.n-0.5),sy2=isoY(z.zx+z.n-0.5,z.zy+z.n-0.5)+hh/2;
    const wx=isoX(z.zx+0.5,z.zy+z.n-0.5)-TW()/2,wy=isoY(z.zx+0.5,z.zy+z.n-0.5);
    // label = centre de la case centrale
    const mcx=z.zx+(z.n-1)/2+0.5, mcy=z.zy+(z.n-1)/2+0.5;
    const cx=isoX(mcx,mcy),cy=isoY(mcx,mcy);
    if(cx<-60||cx>APP_W+60||cy<-60||cy>APP_H+60)continue;
    ctx.save();ctx.globalAlpha=.45+.2*Math.sin(performance.now()/500);
    ctx.fillStyle='rgba(255,220,80,.22)';ctx.strokeStyle='#ffd84d';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(ex,ey);ctx.lineTo(sx2,sy2);ctx.lineTo(wx,wy);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold '+(12*zoom+5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒 '+zoneCost(),cx,cy);ctx.restore();}
  // clairieres forestieres a defricher (halo vert + prix)
  if(W.landgroups){for(const g of W.landgroups){if(g.owned)continue;
    const q=groupQuad(g);
    const minx=Math.min(q[0][0],q[1][0],q[2][0],q[3][0]),maxx=Math.max(q[0][0],q[1][0],q[2][0],q[3][0]);
    const miny=Math.min(q[0][1],q[1][1],q[2][1],q[3][1]),maxy=Math.max(q[0][1],q[1][1],q[2][1],q[3][1]);
    if(maxx<-40||minx>APP_W+40||maxy<-40||miny>APP_H+40)continue;
    const cx=isoX(g.gx+g.gw/2,g.gy+g.gh/2),cy=isoY(g.gx+g.gw/2,g.gy+g.gh/2);
    ctx.save();ctx.globalAlpha=.38+.18*Math.sin(performance.now()/600);
    ctx.fillStyle='rgba(90,180,70,.26)';ctx.strokeStyle='#7ee06a';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.lineTo(q[3][0],q[3][1]);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold '+(12*zoom+5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🪓 Défricher · '+money(g.cost),cx,cy);ctx.restore();}}
  updateParticles();drawParticles();
  requestAnimationFrame(draw);
}

function renderLab(){
  const list=document.getElementById('lablist');list.innerHTML='';
  LAB.forEach(u=>{
    const l=lab[u.key],maxed=l>=u.max,cost=labCost(u);
    const can=coin>=cost&&!maxed;
    const item=document.createElement('div');item.className='labitem';
    item.innerHTML='<span class="labemo">'+u.emo+'</span>'+
      '<div class="labinfo"><div class="labname">'+u.name+'</div>'+
      '<div class="labdesc">'+u.desc+'</div>'+
      '<div class="lablvl">Niveau '+l+(maxed?' · MAX':'/'+u.max)+'</div></div>'+
      '<button class="labbuy" data-k="'+u.key+'" '+(can?'':'disabled')+'>'+(maxed?'MAX':money(cost)+' 💰')+'</button>';
    list.appendChild(item);
  });
  document.querySelectorAll('.labbuy').forEach(b=>b.addEventListener('click',()=>buyLab(b.dataset.k)));
}
function money(n){return Math.floor(n).toLocaleString('fr-FR');}
function buyLab(k){const u=LAB.find(x=>x.key===k),l=lab[k];if(l>=u.max)return;const cost=labCost(u);
  if(coin<cost){toast('Pas assez 💰');return;}
  setCoin(coin-cost);lab[k]=l+1;coinPulse();toast(u.name+' · niveau '+(l+1)+' !');renderLab();updateStock();}
function openLab(){document.getElementById('labmodal').classList.add('show');renderLab();}
function closeLab(){document.getElementById('labmodal').classList.remove('show');}
document.getElementById('labbtn').addEventListener('click',openLab);
document.getElementById('labclose').addEventListener('click',closeLab);
document.getElementById('labmodal').addEventListener('click',e=>{if(e.target.id==='labmodal')closeLab();});
document.getElementById('sellbtn').addEventListener('click',sellAll);
document.querySelectorAll('.care').forEach(btn=>{btn.addEventListener('click',()=>applyCare(btn.dataset.c));});
updateStock();
let ds=null,dm=false,cs=null,md=false,pinch=null;
function xy(e){const r=cv.getBoundingClientRect(),s=APP_W/r.width,t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*s,(t.clientY-r.top)*s];}
function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
// milieu des 2 doigts en coords ecran (APP)
function midXY(e){const r=cv.getBoundingClientRect(),s=APP_W/r.width,t=e.touches;return[((t[0].clientX+t[1].clientX)/2-r.left)*s,((t[0].clientY+t[1].clientY)/2-r.top)*s];}
// zoom ANCRE sur un point ecran (sx,sy) : le monde sous ce point y reste (pinch/molette/boutons)
function zoomAt(nz,sx,sy){nz=clamp(nz,0.4,1.7);
  const wx=(sx-APP_W/2-cam.x)/(TW()/2), wy=(sy-APP_H*0.28-cam.y)/(TH()/2); // point monde sous l'ancre
  zoom=nz;
  cam.x=sx-APP_W/2-wx*(TW()/2); cam.y=sy-APP_H*0.28-wy*(TH()/2);           // recadre pour garder l'ancre
  clampCam();}
function ft(px,py,t,c){const e=document.createElement('div');e.className='float';e.textContent=t;e.style.left=px+'px';e.style.top=py+'px';if(c)e.style.color=c;document.getElementById('app').appendChild(e);setTimeout(()=>e.remove(),1100);}
function coinPulse(){const el=document.getElementById('coin');el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
function showCarebar(s){const el=document.getElementById('carebar');if(el)el.classList.toggle('show',s);updateCareUI();}
function updateCareUI(){
  document.getElementById('bw') && (document.getElementById('bw').textContent=boosts.water);
  document.getElementById('bs') && (document.getElementById('bs').textContent=boosts.sun);
  document.getElementById('bn') && (document.getElementById('bn').textContent=boosts.nute);
}
function applyCare(type){
  if(!selCell||selCell.state!=='growing'){showCarebar(false);return;}
  if(boosts[type]<=0){toast('Plus de '+(type==='water'?'💧 eau':type==='sun'?'☀️ soleil':'🧪 sérum')+' !');return;}
  boosts[type]--;
  // combo
  const now=performance.now();
  if(now-combo.last<combo.window)combo.count++;else combo.count=1;
  combo.last=now;
  const c=combo.count, mult=1+Math.min(c,30)*0.05;
  const amt=34*mult;
  selCell[type]=clamp((selCell[type]||0)+amt,0,200);
  // qualité = moyenne des 3 jauges (influence le rendement)
  selCell.quality=1+((selCell.water+selCell.sun+selCell.nute)/600)*1.5;  // 1 -> 2.5x
  // boost de pousse leger
  selCell.grow=Math.min(1,selCell.grow+0.015*mult);
  if(selCell.grow>=1){selCell.grow=1;selCell.state='ready';}
  // feedback
  const ix=isoX(selCell.x+0.5,selCell.y+0.5),iy=isoY(selCell.x+0.5,selCell.y+0.5);
  const fx={water:'#5ab0ff',sun:'#ffd84d',nute:'#b86bff'}[type];
  const emo={water:'💧',sun:'☀️',nute:'🧪'}[type];
  burst(ix,iy-TH()*0.5,fx,5+Math.min(c,10));
  if(c>=2)ft(ix,iy-TH()*1.3,emo+' x'+c,fx);else ft(ix,iy-TH(),emo,fx);
  updateCareUI();
  if(selCell.state==='ready'){showCarebar(false);selCell=null;}
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1800);}
function updateStock(){const el=document.getElementById('stockval');if(el)el.textContent=stock+' g';const bar=document.getElementById('sellbar');if(bar)bar.classList.toggle('show',stock>0);const pe=document.getElementById('sellprice');if(pe)pe.textContent='≈ '+Math.floor(stock*marketPrice*valueMult())+' 💰';}
function sellAll(){if(stock<=0)return;const earned=Math.floor(stock*marketPrice*valueMult());setCoin(coin+earned);coinPulse();
  toast('Vendu '+stock+' g · +'+earned+' 💰');stock=0;updateStock();
  // fluctuation du prix apres vente
  marketPrice=Math.max(5,Math.min(14,marketPrice+(Math.random()*2-1)));}
function pickCrop(px,py){let b=null,bd=1e9;for(const k in cropCells){const c=cropCells[k];const x=isoX(c.x+.5,c.y+.5),y=isoY(c.x+.5,c.y+.5)+TH()*.5;const d=Math.abs(px-x)/(TW()*.55)+Math.abs(py-y)/(TH()*.55);if(d<=1&&d<bd){bd=d;b=c;}}return b;}
function pickZone(px,py){for(const z of W.cropzones){if(z.owned||!zoneAvailable(z))continue;const mcx=z.zx+(z.n-1)/2+0.5,mcy=z.zy+(z.n-1)/2+0.5;const cx=isoX(mcx,mcy),cy=isoY(mcx,mcy);if(Math.abs(px-cx)<TW()*1.6&&Math.abs(py-cy)<TH()*2.6)return z;}return null;}
// === CLAIRIERES (landgroups) : gros lots forestiers a defricher ===
function pointInQuad(px,py,q){let s=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];const cr=(b[0]-a[0])*(py-a[1])-(b[1]-a[1])*(px-a[0]);const sg=cr>0?1:cr<0?-1:0;if(sg){if(s&&sg!==s)return false;s=sg;}}return true;}
function groupQuad(g){return [[isoX(g.gx,g.gy),isoY(g.gx,g.gy)],[isoX(g.gx+g.gw,g.gy),isoY(g.gx+g.gw,g.gy)],[isoX(g.gx+g.gw,g.gy+g.gh),isoY(g.gx+g.gw,g.gy+g.gh)],[isoX(g.gx,g.gy+g.gh),isoY(g.gx,g.gy+g.gh)]];}
function pickLandGroup(px,py){if(!W.landgroups)return null;for(const g of W.landgroups){if(g.owned)continue;if(pointInQuad(px,py,groupQuad(g)))return g;}return null;}
function buyLandGroup(g,px,py){
  if(coin<g.cost){ft(px,py,'Pas assez 💰','#ff8080');return;}
  setCoin(coin-g.cost);g.owned=true;coinPulse();
  const gi=W.landgroups.indexOf(g),CUT=['tree','treeC','bush','bushF','flower','stump'];
  for(let y=g.gy;y<g.gy+g.gh;y++)for(let x=g.gx;x<g.gx+g.gw;x++){
    if(x<0||y<0||x>=MW||y>=MH)continue;
    const d=W.decor[y][x];
    if(d&&CUT.includes(d[0])){burst(isoX(x+0.5,y+0.5),isoY(x+0.5,y+0.5)-TH()*0.5,'#7cae4a',6);W.decor[y][x]=null;}
  }
  // sous les futures parcelles: terre cultivable + on vire les rochers
  for(const z of W.cropzones){if(z.group!==gi)continue;
    for(let dy=0;dy<z.n;dy++)for(let dx=0;dx<z.n;dx++){const x=z.zx+dx,y=z.zy+dy;if(x<0||y<0||x>=MW||y>=MH)continue;
      if(W.decor[y][x]&&W.decor[y][x][0]==='rock')W.decor[y][x]=null;
      W.ground[y][x]='soil';}}
  toast('Forêt défrichée ! 🪓');
}
// selCell est déclarée plus haut (avant draw) pour éviter le TDZ
function showSeedbar(s){document.getElementById('seedbar').classList.toggle('show',s);}
function onTap(px,py){const c=pickCrop(px,py);if(c){
    if(c.state==='empty'){selCell=c;showSeedbar(true);showCarebar(false);}   // selectionner -> graines
    else if(c.state==='ready'){const q=c.quality||1;const grams=Math.floor((12+Math.floor(Math.random()*10))*q*yieldMult());  // recolte x qualité x labo
      stock+=grams;updateStock();
      const ix=isoX(c.x+0.5,c.y+0.5),iy=isoY(c.x+0.5,c.y+0.5);
      ft(ix,iy-TH(),'+'+grams+' g 🌿');
      const cols=['#8bd450','#b86bff','#5a9bff','#ff9d3c','#9b8fb5','#e0913c'][c.variety]||'#8bd450';
      burst(ix,iy,cols,18);
      c.state='empty';c.grow=0;selCell=null;showSeedbar(false);showCarebar(false);}
    else if(c.state==='growing'){  // selectionner -> panneau de soins
      selCell=c;showCarebar(true);showSeedbar(false);}
    return;}
  // tap ailleurs -> tout fermer
  selCell=null;showSeedbar(false);showCarebar(false);
  const z=pickZone(px,py);if(z){const cost=zoneCost();if(coin<cost){ft(px,py,'Pas assez 💰','#ff8080');return;}setCoin(coin-cost);z.owned=true;rebuildCrop();ft(px,py-20,'Zone débloquée ! 🌱','#9dffb8');return;}
  const g=pickLandGroup(px,py);if(g)buyLandGroup(g,px,py);}
// boutons graines
document.querySelectorAll('.seed').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(!selCell)return;
    const v=parseInt(btn.dataset.v);
    selCell.state='growing';selCell.grow=0;selCell.variety=v;selCell.water=0;selCell.sun=0;selCell.nute=0;selCell.quality=1;
    selCell=null;showSeedbar(false);
  });
});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2)pinch={d:dist(e.touches),z:zoom};else{ds=xy(e);cs={...cam};dm=false;}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2&&pinch){const m=midXY(e);zoomAt(pinch.z*dist(e.touches)/pinch.d,m[0],m[1]);return;}if(!ds)return;const[x,y]=xy(e);if(Math.abs(x-ds[0])+Math.abs(y-ds[1])>10)dm=true;cam.x=cs.x+x-ds[0];cam.y=cs.y+y-ds[1];clampCam();},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(pinch){pinch=null;return;}if(!dm&&ds)onTap(ds[0],ds[1]);ds=null;},{passive:false});
cv.addEventListener('mousedown',e=>{ds=xy(e);cs={...cam};dm=false;md=true;});cv.addEventListener('mousemove',e=>{if(!md)return;const[x,y]=xy(e);if(Math.abs(x-ds[0])+Math.abs(y-ds[1])>10)dm=true;cam.x=cs.x+x-ds[0];cam.y=cs.y+y-ds[1];clampCam();});cv.addEventListener('mouseup',e=>{if(!dm&&ds)onTap(ds[0],ds[1]);ds=null;md=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();const m=xy(e);zoomAt(zoom*(e.deltaY<0?1.1:.9),m[0],m[1]);},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(zoom*1.2,APP_W/2,APP_H/2);document.getElementById('zout').onclick=()=>zoomAt(zoom/1.2,APP_W/2,APP_H/2);
setInterval(()=>{for(const k in cropCells){const c=cropCells[k];if(c.state==='growing'){c.grow+=0.0067/speedMult();if(c.grow>=1){c.grow=1;c.state='ready';}}}},200);
