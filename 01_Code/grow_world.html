<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>TINY GROW</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{height:100%;background:#0a0d0a;overflow:hidden;font-family:system-ui,sans-serif}
#app{position:relative;width:100%;height:100vh;height:100dvh;margin:0 auto;background:linear-gradient(180deg,#90b8d4 0%,#a6c897 32%,#52762f 100%);overflow:hidden;touch-action:none}
#iso{display:block;width:100%;height:100%}
.topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;background:rgba(8,12,8,.85);border:1px solid #3a4a2a;border-radius:14px;padding:9px 10px;z-index:6}
.coin{color:#ffcf4d;font-weight:800;font-size:20px;text-shadow:0 1px 2px #000;white-space:nowrap;flex-shrink:0}.coin::before{content:"💰 "}.spacer{flex:1}
.tag{color:#8fd96f;font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoombtns{position:absolute;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:6}.zoombtns button{width:42px;height:42px;border-radius:11px;border:1.5px solid #6fc04d;background:rgba(20,40,15,.85);color:#eaffea;font-size:22px;font-weight:800}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#eaffd0;font-size:11px;font-style:italic;text-shadow:0 1px 3px #000;pointer-events:none;z-index:5}
.float{position:absolute;color:#ffe87a;font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 6px #000,0 0 12px rgba(255,200,60,.6);z-index:7;opacity:1;transform:translate(-50%,0) scale(0.3);animation:floatpop 1.1s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
@keyframes floatpop{0%{transform:translate(-50%,0) scale(0.3);opacity:0}18%{transform:translate(-50%,-12px) scale(1.25);opacity:1}35%{transform:translate(-50%,-20px) scale(1)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.coin.pulse{animation:coinpulse .4s ease-out}
@keyframes coinpulse{0%{transform:scale(1)}40%{transform:scale(1.28);color:#ffe87a}100%{transform:scale(1)}}
.seedbar{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;max-height:calc(100dvh - 60px);overflow-y:auto;background:linear-gradient(180deg,rgba(20,28,18,0.0),rgba(16,22,14,0.96) 22%);padding:12px 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:30;}
.seedbar.show{transform:translateY(0);}
.seedtitle{color:#e8f5d8;font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;text-shadow:0 1px 3px #000;}
.seeds{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;}
.seed{flex:1 1 0;min-width:0;max-width:88px;background:linear-gradient(180deg,#33402a,#222c1c);border:1.5px solid #4a5c38;border-radius:14px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .12s,border-color .12s;}
.seed:active{transform:scale(0.94);}
.seed.sel{border-color:#9dffb8;box-shadow:0 0 0 2px rgba(157,255,184,0.4),0 3px 8px rgba(0,0,0,0.4);}
.seed .ico{font-size:24px;line-height:1;}
.seed .nm{font-size:10px;color:#cfe6bd;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.stock{background:rgba(40,60,30,0.6);border:1px solid #4a6c38;border-radius:12px;padding:3px 8px;color:#cfe6bd;font-size:14px;white-space:nowrap;flex-shrink:0;}
.stock b{color:#9dffb8;}
.sellbar{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#2a3a22,#1c2716);border:1.5px solid #4a6c38;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(0,0,0,0.5);transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:25;}
.sellbar.show{transform:translateY(0);}
.sellinfo{flex:1;display:flex;flex-direction:column;gap:2px;}
.selllabel{color:#cfe6bd;font-size:13px;}
.sellprice{color:#ffe87a;font-weight:800;font-size:18px;}
.sellbtn{background:linear-gradient(180deg,#ffd84d,#f0a820);color:#3a2810;font-weight:800;font-size:15px;border:none;border-radius:14px;padding:12px 20px;cursor:pointer;box-shadow:0 3px 0 #c88410,0 4px 10px rgba(0,0,0,.4);transition:transform .1s;}
.sellbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c88410;}
.toast{position:absolute;left:50%;top:112px;transform:translateX(-50%) translateY(-20px);background:rgba(20,28,16,0.95);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;border:1px solid #4a6c38;opacity:0;pointer-events:none;transition:all .3s;z-index:40;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.carebar{position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;max-height:calc(100dvh - 60px);overflow-y:auto;background:linear-gradient(180deg,rgba(20,28,18,0.0),rgba(16,22,14,0.96) 22%);padding:12px 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:31;}
.carebar.show{transform:translateY(0);}
.caretitle{color:#e8f5d8;font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;text-shadow:0 1px 3px #000;}
.cares{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;}
.care{position:relative;flex:1 1 0;min-width:0;max-width:110px;background:linear-gradient(180deg,#33402a,#222c1c);border:1.5px solid #4a5c38;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform .1s;}
.care:active{transform:scale(0.92);}
.care .cico{font-size:26px;}
.care .cnm{font-size:11px;color:#cfe6bd;font-weight:500;}
.care .cstk{position:absolute;top:-7px;right:-5px;background:#ffd84d;color:#3a2810;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;border:2px solid #1c2716;}
/* ecrans courts (paysage): UI plus compacte pour que les barres du bas tiennent */
@media (max-height:430px){
  .seedtitle,.caretitle{margin-bottom:5px;font-size:13px;}
  .seedbar,.carebar{padding-top:8px;}
  .seed{padding:5px 3px;border-radius:11px;}.seed .ico{font-size:19px;}.seed .nm{font-size:9px;}
  .care{padding:6px 4px;}.care .cico{font-size:20px;}.care .cnm{font-size:9px;}
}
/* tres large (desktop/tablette paysage): limite la largeur des cartes centrees */
@media (min-width:900px){ .seeds,.cares{max-width:760px;margin:0 auto;} }

.labbtn{position:absolute;right:14px;top:min(340px,46vh);width:64px;height:64px;border-radius:18px;background:linear-gradient(180deg,#3a4a2c,#26341c);border:2px solid #5a7038;font-size:30px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:20;}
.labbtn:active{transform:scale(0.94);}
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.modal.show{display:flex;}
.modalbox{width:100%;max-width:480px;background:linear-gradient(180deg,#2a3a22,#1a2414);border-radius:24px 24px 0 0;border-top:2px solid #4a6c38;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:75%;overflow-y:auto;animation:slideup .3s cubic-bezier(.2,.8,.3,1);}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modalhead{display:flex;justify-content:space-between;align-items:center;color:#e8f5d8;font-size:19px;font-weight:800;margin-bottom:16px;}
.modalx{background:rgba(255,255,255,0.1);border:none;color:#cfe6bd;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;}
.lablist{display:flex;flex-direction:column;gap:12px;}
.labitem{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#33402a,#222c1c);border:1.5px solid #4a5c38;border-radius:16px;padding:12px;}
.labemo{font-size:34px;}
.labinfo{flex:1;}
.labname{color:#e8f5d8;font-weight:700;font-size:15px;}
.labdesc{color:#9cb888;font-size:12px;margin-top:2px;}
.lablvl{color:#7dd87d;font-size:12px;margin-top:3px;}
.labbuy{background:linear-gradient(180deg,#ffd84d,#f0a820);color:#3a2810;font-weight:800;font-size:13px;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 #c88410;white-space:nowrap;}
.labbuy:active{transform:translateY(2px);box-shadow:0 1px 0 #c88410;}
.labbuy:disabled{background:#555;color:#999;box-shadow:0 3px 0 #333;cursor:default;}
/* === MON DOMAINE : galerie fullscreen + cartes collection + cinematique === */
.homebtn{position:absolute;right:14px;top:calc(min(340px,46vh) + 74px);width:64px;height:64px;border-radius:18px;background:linear-gradient(180deg,#4a3a24,#33261a);border:2px solid #8a7038;font-size:30px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:20;}
.homebtn:active{transform:scale(0.94);}
.wkbtn{position:absolute;right:14px;top:calc(min(340px,46vh) + 148px);width:64px;height:64px;border-radius:18px;background:linear-gradient(180deg,#2e3c4a,#1e2a34);border:2px solid #5a7488;font-size:30px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:20;display:none;}
.wkbtn.show{display:block;}
.wkbtn:active{transform:scale(0.94);}
.homebadge{background:rgba(60,45,20,0.6);border:1px solid #8a7038;border-radius:12px;padding:3px 8px;color:#ffe0a0;font-size:14px;cursor:pointer;pointer-events:auto;white-space:nowrap;flex-shrink:0;}
.homebadge b{color:#ffd84d;}
.homefull{position:absolute;inset:0;background:radial-gradient(120% 85% at 50% 0%,#243218,rgba(5,8,5,0.98) 62%);display:none;flex-direction:column;z-index:50;}
.homefull.show{display:flex;animation:homefade .25s ease;}
@keyframes homefade{from{opacity:0}to{opacity:1}}
.homehead{display:flex;align-items:center;gap:10px;padding:16px 16px 8px;color:#f2e8c8;font-weight:800;font-size:16px;text-shadow:0 1px 3px #000;}
.homehead .htitle{flex:1;min-width:0;}
.homehead .hsub{font-size:12px;color:#c3d6a4;font-weight:600;margin-top:2px;}
.hcoin{color:#ffcf4d;font-weight:800;font-size:14px;white-space:nowrap;background:rgba(0,0,0,0.35);border:1px solid #3a4a2a;border-radius:10px;padding:5px 10px;}
.homeprog{height:8px;margin:0 16px 4px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;}
.homeprog i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#f0a820);border-radius:6px;box-shadow:0 0 8px rgba(255,216,77,.7);transition:width .4s;}
.homecar{flex:1;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:12px max(12vw,28px) 16px;align-items:center;-webkit-overflow-scrolling:touch;}
.hcard{scroll-snap-align:center;flex:0 0 236px;background:linear-gradient(180deg,#2e3a24,#1a2414);border:1.5px solid #4a5c38;border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 22px rgba(0,0,0,.5);}
.hcard img{width:198px;height:198px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));pointer-events:none;}
.hcard.hown{border-color:#8fd96f;}
.hcard.hbuy{border-color:#ffd84d;box-shadow:0 0 18px rgba(255,216,77,.35),0 8px 22px rgba(0,0,0,.5);}
.hcard.hlock img{filter:brightness(0.15) drop-shadow(0 8px 12px rgba(0,0,0,.5));}
.hname{color:#f2e8c8;font-weight:800;font-size:15px;text-align:center;}
.hlvl{color:#9cb888;font-size:11px;}
.hbonus{color:#ffe0a0;font-size:12px;text-align:center;background:rgba(255,216,77,0.08);border:1px solid rgba(255,216,77,0.25);border-radius:10px;padding:4px 8px;}
.hstate{color:#8fd96f;font-size:13px;font-weight:700;}
.hcond{color:#c9b28a;font-size:12px;text-align:center;}
.hbtn{background:linear-gradient(180deg,#ffd84d,#f0a820);color:#3a2810;font-weight:800;font-size:14px;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 #c88410;}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c88410;}
.hbtn:disabled{background:#4a4a42;color:#9a9a8a;box-shadow:0 3px 0 #2a2a24;cursor:default;}
.homefoot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));color:#cfe6bd;font-size:12px;text-align:center;border-top:1px solid rgba(255,255,255,0.06);background:rgba(8,12,8,.5);}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60;}
.flash.go{animation:flashgo .9s ease-out;}
@keyframes flashgo{0%{opacity:0}18%{opacity:0.85}100%{opacity:0}}
.cineblock{position:absolute;inset:0;z-index:45;display:none;}
.cineblock.show{display:block;}
/* === 🎯 MISSIONS v15 : carte-tracker (médaillon or + barre épaisse + shine + rayons au done) === */
.mtrack{position:absolute;top:54px;left:8px;right:62px;height:48px;display:none;align-items:center;gap:8px;padding:0 10px 0 6px;background:linear-gradient(180deg,rgba(22,32,17,.93),rgba(10,16,9,.93));border:1.5px solid #4a5c38;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.35);z-index:6;overflow:hidden;cursor:pointer;}
.mtrack .mmed,.mtrack .mcol,.mtrack .mchev{position:relative;z-index:1;}
.mmed{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#5a7038,#2c3a20 70%);border:2px solid #c9a227;box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);}
.mico{font-size:19px;line-height:1;}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.mtxt{color:#eaf5da;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;}
.mbar{position:relative;height:12px;background:rgba(0,0,0,.45);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.08);}
.mbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#b8e86a,#6cb22e 60%,#4d8f22);border-radius:7px;transition:width .4s;}
.mbar i::after{content:'';position:absolute;left:2px;right:2px;top:1px;height:4px;background:rgba(255,255,255,.35);border-radius:4px;}
.mshine{position:absolute;top:-1px;bottom:-1px;width:34px;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-40px) skewX(-14deg);animation:mshine 2.8s ease-in-out infinite;pointer-events:none;}
@keyframes mshine{0%,55%{transform:translateX(-40px) skewX(-14deg)}100%{transform:translateX(min(360px,90vw)) skewX(-14deg)}}
.mnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.85);letter-spacing:.3px;}
.mchev{color:#8fb573;font-size:20px;font-weight:800;flex-shrink:0;}
.mtrack.done{border-color:#ffd84d;background:linear-gradient(180deg,#4a3a14,#2a2008);animation:mgold 1.1s ease-in-out infinite;}
.mtrack.done::before{content:'';position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1;background:repeating-conic-gradient(rgba(255,216,77,.26) 0 13deg,transparent 13deg 26deg);animation:mrays 7s linear infinite;pointer-events:none;z-index:0;}
@keyframes mrays{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.mtrack.done .mmed{border-color:#ffe87a;background:radial-gradient(circle at 35% 30%,#8a6f2d,#4a3a14 70%);animation:mgift .8s ease-in-out infinite;}
@keyframes mgift{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-3px) scale(1.14)}55%{transform:translateY(1px) scale(.97)}}
.mtrack.done .mtxt{color:#ffe87a;}
.mtrack.done .mbar i{background:linear-gradient(180deg,#ffe87a,#f0a820);box-shadow:0 0 8px rgba(255,216,77,.6);}
@keyframes mgold{0%,100%{box-shadow:0 0 4px rgba(255,216,77,.25)}50%{box-shadow:0 0 14px rgba(255,216,77,.75)}}
.mdesc{color:#c9d8b4;font-style:italic;font-size:13px;line-height:1.45;background:rgba(255,255,255,.04);border-left:3px solid #5a7038;border-radius:8px;padding:10px 12px;margin:10px 0 14px;}
.mprog{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin:6px 0 4px;}
.mprog i{display:block;height:100%;background:linear-gradient(90deg,#8fd96f,#5aa03c);border-radius:6px;transition:width .4s;}
.mprog.full i{background:linear-gradient(90deg,#ffd84d,#f0a820);box-shadow:0 0 8px rgba(255,216,77,.7);}
.mreward{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;}
.mrtxt{color:#ffe0a0;font-size:14px;font-weight:700;}
.mgo{width:100%;margin-top:10px;background:linear-gradient(180deg,#8fd96f,#5aa03c);box-shadow:0 3px 0 #3d7a28;color:#12240c;}
/* pièces qui volent vers le compteur + bannière événement + pulse de guidage */
.fcoin{position:absolute;z-index:60;pointer-events:none;will-change:transform;}
.fcoin span{display:block;font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));animation:fpop .22s ease-out;}
@keyframes fpop{from{opacity:0}to{opacity:1}}
.banner{position:absolute;left:50%;top:30%;transform:translateX(-50%) translateY(-16px) scale(.88);max-width:86%;text-align:center;padding:13px 24px;border-radius:16px;font-weight:800;font-size:16px;color:#eaffd8;background:linear-gradient(180deg,#2f4522,#1b2913);border:2px solid #6fc04d;box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s,transform .28s cubic-bezier(.2,1.3,.4,1);z-index:55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.banner.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.banner.gold{border-color:#ffd84d;background:linear-gradient(180deg,#4a3a14,#2a2008);color:#ffe87a;box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 22px rgba(255,216,77,.35);}
.guide{animation:guidepulse .75s ease-in-out 4;}
@keyframes guidepulse{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.4);transform:scale(1)}50%{box-shadow:0 0 26px 8px rgba(255,216,77,.85);transform:scale(1.12)}}
/* ecrans courts (paysage) : boutons flottants compacts + galerie scrollable (APRES les regles de base pour gagner la cascade) */
@media (max-height:430px){
  .labbtn{width:48px;height:48px;font-size:22px;border-radius:14px;top:min(340px,38vh);}
  .homebtn{width:48px;height:48px;font-size:22px;border-radius:14px;top:calc(min(340px,38vh) + 56px);}
  .wkbtn{width:48px;height:48px;font-size:22px;border-radius:14px;left:14px;right:auto;top:min(340px,38vh);}   /* à GAUCHE en paysage court : zéro empilement avec la sellbar */
  .homehead{padding:10px 12px 4px;font-size:14px;}
  .homecar{align-items:flex-start;overflow-y:auto;padding-top:6px;padding-bottom:8px;}
  .hcard{flex-basis:180px;padding:10px;}
  .hcard img{width:122px;height:122px;}
  .homefoot{padding:6px 12px calc(8px + env(safe-area-inset-bottom));}
  .mtrack{top:50px;height:38px;border-radius:12px;gap:6px;}
  .mmed{width:26px;height:26px;border-width:1.5px;}.mico{font-size:14px;}
  .mtxt{font-size:10.5px;}.mbar{height:9px;}.mnum{font-size:8px;}.mchev{font-size:16px;}
  .toast{top:96px;}
}
</style></head><body>
<div id="app"><canvas id="iso"></canvas><div class="topbar"><span class="coin" id="coin">0</span><span class="stock" id="stockbadge">🌿 <b id="stockval">0 g</b></span><span class="spacer"></span><span class="tag homebadge" id="homebadge">🏠<b id="homelvl">1</b></span><span class="tag">🌍 Mon Monde · 🏮v17</span></div>
<div id="mtrack" class="mtrack"><span class="mmed"><span class="mico" id="mico">🎯</span></span><div class="mcol"><span class="mtxt" id="mtxt"></span><div class="mbar"><i id="mtfill"></i><span class="mnum" id="mnum"></span><span class="mshine"></span></div></div><span class="mchev">›</span></div>
<div class="zoombtns"><button id="zin">+</button><button id="zout">−</button></div>

// === 👷 OUVRIERS : James embauche — récoltent les plants mûrs et replantent la MÊME variété.
// Règle : « tu sèmes, ils entretiennent » — jamais de semis d'une case vide, jamais de vente.
// Déclaré AVANT draw() (TDZ, leçon selCell) ; workers/wkClaims en var globaux (règle particles).
const WK_CFG={ MAX:6,
  HIRE:[800,4000,20000,90000,350000,1200000],   // coût des slots 1..6 (calés entre les paliers HOUSE)
  HOUSE_REQ:[2,3,5,7,9,10],                     // niveau de maison requis par slot (« il faut les loger »)
  WALK:1.2, HARVEST_MS:1500, PLANT_MS:1000,     // cadences de base -> cycle ~5s/plant
  TROT:1.8, TROT_DIST:6,                        // trajet lointain : il presse le pas (x1.8 au-delà de 6 cases)
  AVG_WALK:3, OFF_EFF:0.35 };                   // paramètres de la simulation hors-ligne
const WK_UP=[   // upgrades, pattern LAB (base*mul^lvl)
  {key:'walk', name:'Bonnes bottes', emo:'👟', base:600,  mul:1.75, max:10, desc:'+12% vitesse de marche'},
  {key:'dex',  name:'Gants experts', emo:'🧤', base:900,  mul:1.75, max:10, desc:'-8% temps de récolte/replante'},
  {key:'night',name:'Lanternes',     emo:'🏮', base:2500, mul:2.1,  max:5,  desc:'+5% efficacité hors-ligne'}];
let workerCount=0, wkUp={walk:0,dex:0,night:0};   // PERSISTANT (save/load)
var workers=[];    // RUNTIME — jamais sauvegardé (respawn à la maison au boot)
var wkClaims={};   // "x,y" -> id : réservation d'un plant ready (évite 2 ouvriers sur la même cible)
function wkHireCost(){return WK_CFG.HIRE[workerCount];}
function wkHouseReq(){return WK_CFG.HOUSE_REQ[workerCount];}
function wkUpCost(u){return Math.floor(u.base*Math.pow(u.mul,wkUp[u.key]));}
function wkWalkSpeed(){return WK_CFG.WALK*Math.pow(1.12,wkUp.walk);}   // cases/s
function wkActMs(base){return base*Math.pow(0.92,wkUp.dex);}
function wkOfflineEff(){return WK_CFG.OFF_EFF+0.05*wkUp.night;}        // 0.35 -> 0.60
function spawnWorker(i){workers.push({id:i,x:HOME_POS.x-2,y:HOME_POS.y+3,x0:0,y0:0,x1:0,y1:0,t0:0,t1:0,state:'idle',target:null,dir:1,scanT:0,zone:null});}   // l'allée SW : ils sortent de chez James
// récolte un plant ready : gains + FX + paliers + case vidée. PAS de save() (l'appelant décide).
// c.variety est volontairement CONSERVÉ -> la replante (joueur ou ouvrier) garde la même variété.
function harvestCell(c){
  const q=c.quality||1, grams=Math.floor((12+Math.floor(Math.random()*10))*q*yieldMult());
  stock+=grams; totalHarvest+=grams; updateStock();
  const ix=isoX(c.x+0.5,c.y+0.5), iy=isoY(c.x+0.5,c.y+0.5);
  ft(ix,iy-TH(),'+'+grams+' g 🌿');
  checkPaliers(ix,iy);
  burst(ix,iy,(['#8bd450','#b86bff','#5a9bff','#ff9d3c','#9b8fb5','#e0913c'][c.variety]||'#8bd450'),18);
  c.state='empty'; c.grow=0;
  return grams;
}
function workerPos(w,now){   // position affichée, interpolée (lue par draw, ne mute rien)
  if(w.state!=='walk')return{x:w.x,y:w.y};
  if(now>=w.t1)return{x:w.x1,y:w.y1};
  const k=(now-w.t0)/(w.t1-w.t0);
  return{x:w.x0+(w.x1-w.x0)*k, y:w.y0+(w.y1-w.y0)*k};
}
function wkRelease(w){if(w.target)delete wkClaims[w.target];w.target=null;w.state='idle';w.scanT=0;}
function wkNextStep(w,c,now){   // un pas d'UNE case, axe du plus grand écart (marche en L, zéro pathfinding)
  const dx=c.x-w.x, dy=c.y-w.y, dd=Math.abs(dx)+Math.abs(dy);
  const sx=Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0, sy=sx?0:Math.sign(dy);
  const sp=wkWalkSpeed()*(dd>WK_CFG.TROT_DIST?WK_CFG.TROT:1);   // champ lointain -> trot sur les routes, pas normal à l'arrivée
  w.x0=w.x;w.y0=w.y;w.x1=w.x+sx;w.y1=w.y+sy;w.t0=now;w.t1=now+1000/sp;
  const dS=(w.x1-w.x0)-(w.y1-w.y0); if(dS)w.dir=Math.sign(dS);   // flip selon le déplacement ÉCRAN (c-r)
}
// Ciblage à DEUX niveaux (anti-famine des champs lointains) : je choisis d'abord un CHAMP, puis je
// travaille SES plants. Sticky (ma zone produit -> j'y reste), anti-entassement (zone la moins
// chargée en ouvriers, tie-break la plus proche). w.zone est runtime pur (jamais sauvegardé).
function wkFindTarget(w,now){
  const cand={};   // zi -> {k,d} : meilleur plant ready non réservé de chaque zone (un seul scan)
  for(const k in cropCells){const c=cropCells[k];
    if(c.state!=='ready'||wkClaims[k]||c===selCell)continue;   // selCell exclu : on ne vole pas la case du joueur
    const d=Math.abs(c.x-w.x)+Math.abs(c.y-w.y);
    const b=cand[c.zi];if(!b||d<b.d)cand[c.zi]={k,d};}
  let zi=(w.zone!=null&&cand[w.zone])?w.zone:null;             // STICKY : zéro va-et-vient tant que ça produit
  if(zi==null){
    const load={};for(const o of workers)if(o!==w&&o.zone!=null)load[o.zone]=(load[o.zone]||0)+1;
    let bs=Infinity;
    for(const z in cand){const s=(load[z]||0)*1e6+cand[z].d;if(s<bs){bs=s;zi=+z;}}   // moins chargée, puis plus proche
  }
  if(zi==null){w.zone=null;return;}   // rien de mûr nulle part
  w.zone=+zi;
  const bk=cand[zi].k,c=cropCells[bk];wkClaims[bk]=w.id;w.target=bk;
  if(cand[zi].d===0){w.state='harvest';w.t1=now+wkActMs(WK_CFG.HARVEST_MS);}
  else{w.state='walk';wkNextStep(w,c,now);}
}
function updateWorkers(now){   // LOGIQUE au tick 200ms — timers absolus => robuste au throttle d'onglet caché
  for(const w of workers){
    const c=w.target?cropCells[w.target]:null;
    if(w.state==='walk'){
      if(!c||c.state!=='ready'){wkRelease(w);continue;}        // récoltée à la main entre-temps -> abandon propre
      if(now>=w.t1){w.x=w.x1;w.y=w.y1;
        if(w.x===c.x&&w.y===c.y){w.state='harvest';w.t1=now+wkActMs(WK_CFG.HARVEST_MS);}
        else wkNextStep(w,c,now);}
    }else if(w.state==='harvest'){
      if(!c||c.state!=='ready'){wkRelease(w);continue;}
      if(now>=w.t1){harvestCell(c);w.state='plant';w.t1=now+wkActMs(WK_CFG.PLANT_MS);}
    }else if(w.state==='plant'){
      if(now>=w.t1){
        if(c&&c.state==='empty'){c.state='growing';c.grow=0;c.water=0;c.sun=0;c.nute=0;c.quality=1;   // même variety (conservée)
          burst(isoX(c.x+.5,c.y+.5),isoY(c.x+.5,c.y+.5),'#9dffb8',6);}
        wkRelease(w);}
    }else if(now>=w.scanT){w.scanT=now+500;wkFindTarget(w,now);}   // idle : re-scan throttlé 2x/s
  }
}
function drawWorker(w,p,now){
  const ix=isoX(p.x+0.5,p.y+0.5)+((w.id%3)-1)*3*zoom;   // micro-offset par id : jamais 2 ouvriers pile superposés
  const iy=isoY(p.x+0.5,p.y+0.5)+TH()*0.18;             // pied posé dans la case
  const spr=IMG['worker_'+(1+w.id%3)];                  // le jour où worker_1..3.png entrent au PACK : swap auto
  if(spr&&spr.complete&&spr.naturalWidth){shadow(ix,iy,TW()*0.5);drawSp(spr,ix,iy,TW()*0.55,null);return;}
  shadow(ix,iy,TW()*0.42);                              // FALLBACK asset-free : emoji canvas (comme le ✨ des ready)
  const s=26*zoom, bob=w.state==='walk'?Math.abs(Math.sin(now/110))*3*zoom:0;
  ctx.save();ctx.translate(ix,iy-bob);
  if(w.dir<0)ctx.scale(-1,1);                           // regarde dans le sens de la marche
  if(w.state==='harvest')ctx.scale(1,0.94+0.06*Math.sin(now/120));   // petit « squat » de travail
  ctx.font=s+'px serif';ctx.textAlign='center';ctx.fillText('👷',0,0);ctx.restore();
  if(w.state==='harvest'||w.state==='plant'){           // bulle d'action qui pulse
    ctx.save();ctx.globalAlpha=.55+.45*Math.sin(now/280);ctx.font=(11*zoom)+'px serif';ctx.textAlign='center';
    ctx.fillText(w.state==='harvest'?'✂️':'🌱',ix,iy-s*1.15);ctx.restore();}
}
// HORS-LIGNE analytique (déterministe -> pas d'exploit reload) : régime permanent au-delà de la
// 1re pousse ; le champ mûr affiché au retour (growCells(off)) EST ce dernier cycle non compté.
function wkOfflineGains(offMs){
  if(workerCount<=0)return 0;
  let N=0;for(const k in cropCells)if(cropCells[k].state!=='empty')N++;   // cases « en rotation »
  if(N<=0)return 0;
  const growS=GROW_MS*speedMult()/1000;
  const cycle=WK_CFG.AVG_WALK/wkWalkSpeed()+(WK_CFG.HARVEST_MS+WK_CFG.PLANT_MS)*Math.pow(0.92,wkUp.dex)/1000;
  const rate=Math.min(workerCount/cycle, N/growS);                        // goulot = bras OU champ
  const effS=Math.max(0,offMs/1000-growS);
  return Math.floor(rate*effS*wkOfflineEff()*16.5*yieldMult());           // 16.5 = espérance de la récolte, quality 1
}

function isoX(c,r){return APP_W/2+(c-r)*TW()/2+cam.x;}
var particles=[];
var revealFX=null;   // {x,y,t0,dur} : onde dorée du reveal de la maison (dessinée en fin de draw)
function burst(px,py,color,n){for(var i=0;i<(n||14);i++){var a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5;particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col:color||'#ffe87a',sz:2+Math.random()*3});}}
function updateParticles(){for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.96;p.life-=0.025;}particles=particles.filter(function(p){return p.life>0;});}
function drawParticles(){ctx.save();for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill();}ctx.restore();}
function isoYb(c,r){return APP_H*0.28+(c+r)*TH()/2+cam.y;}      // sol niveau 0
function isoY(c,r){return isoYb(c,r)-H(c,r)*EH();}              // avec hauteur
var _ccu=0;   // rAF du count-up en cours (tout setCoin concurrent snap le label à la vérité)
function setCoin(v){coin=v;if(_ccu){cancelAnimationFrame(_ccu);_ccu=0;}document.getElementById('coin').textContent=Math.floor(coin).toLocaleString('fr-FR');}
function coinCountUp(from,ms){   // anime le LABEL from -> coin (l'état réel est déjà commité)
  if(_ccu)cancelAnimationFrame(_ccu);const to=coin,t0=performance.now(),el=document.getElementById('coin');
  (function st(){const k=Math.min(1,(performance.now()-t0)/(ms||700)),e=1-Math.pow(1-k,3);
    el.textContent=Math.floor(from+(to-from)*e).toLocaleString('fr-FR');
    if(k<1)_ccu=requestAnimationFrame(st);else _ccu=0;})();
}
setCoin(coin);

// dessine une tuile sol losange (clip + texture carree seamless)
function tile(sqKey,c,r){const img=IMG[sqKey];if(!img||!img.complete||!img.naturalWidth)return;
  const x=isoX(c+0.5,r+0.5),y=isoY(c+0.5,r+0.5);const w=TW(),h=TH();
  // CLIP losange iso exact : coupe le debord aux aretes -> zero chevauchement,
  // motif des paves non deforme (ratio image conserve).
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x-w/2,y);ctx.closePath();
  ctx.clip();
  const ow=w*1.12,oh=ow*(img.naturalHeight/img.naturalWidth);
  ctx.drawImage(img,x-ow/2,y-oh/2,ow,oh);
  ctx.restore();}

// parois: pour une case de hauteur h, dessine les faces gauche/droite visibles
// si le voisin (en avant a l'ecran) est plus bas.
function walls(c,r){
  const h=H(c,r);if(h<=0)return;
  const x=isoX(c+0.5,r+0.5),yT=isoY(c+0.5,r+0.5);
  const w=TW(),th=TH();
  const img=IMG['wallTex'];if(!img||!img.complete)return;
  // hauteur de chute = difference avec le voisin le plus bas en avant (SE=x, SW=y)
  const dE=h-H(c+1,r), dS=h-H(c,r+1);
  const B=[x,yT+th/2],L=[x-w/2,yT],R=[x+w/2,yT];
  function face(p1,p2,drop,sh){
    if(drop<=0)return;const H2=drop*EH();
    ctx.save();
    // parallelogramme exact de la face (suit l'arete iso, pas de marche)
    ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p2[0],p2[1]+H2);ctx.lineTo(p1[0],p1[1]+H2);ctx.closePath();
    ctx.clip();
    const x0=Math.min(p1[0],p2[0]),x1=Math.max(p1[0],p2[0]),ww=(x1-x0)||w/2;
    // texture repetee verticalement
    let yy=Math.min(p1[1],p2[1])-th; const yend=Math.max(p1[1],p2[1])+H2+th;
    while(yy<yend){ctx.drawImage(img,x0,yy,ww,th*2.2);yy+=th*2;}
    // ombrage DANS le clip (suit la forme, pas de rectangle qui deborde)
    ctx.fillStyle='rgba(10,16,8,'+sh+')';ctx.fill();
    ctx.restore();
  }
  // face droite (vers SE, voisin x+1) et face gauche (vers SW, voisin y+1)
  face(B,R,dE,0.16);   // droite
  face(L,B,dS,0.32);   // gauche (plus sombre)
}

function drawSp(img,cx,cyB,tw,a){if(!img||!img.complete||!img.naturalWidth)return;const r=img.naturalHeight/img.naturalWidth;if(a!=null){ctx.save();ctx.globalAlpha=a;ctx.drawImage(img,cx-tw/2,cyB-tw*r,tw,tw*r);ctx.restore();}else ctx.drawImage(img,cx-tw/2,cyB-tw*r,tw,tw*r);}

// dessine un sprite qui se balance dans le vent : la BASE reste ancree (cx,cyB),
// le HAUT penche horizontalement selon le temps. amp = amplitude du balancement.
function drawSpWind(img,cx,cyB,tw,amp,phase){
  if(!img||!img.complete||!img.naturalWidth)return;
  const r=img.naturalHeight/img.naturalWidth, th=tw*r;
  const T=performance.now()/1000;
  // brise principale lente + micro-frisson rapide, dephase par objet
  const sway=Math.sin(T*0.9+phase)*amp + Math.sin(T*2.7+phase*1.7)*amp*0.25;
  ctx.save();
  ctx.translate(cx,cyB);          // origine = pied du sprite
  ctx.transform(1,0,sway,1,0,0);  // skew horizontal : le haut se decale, le bas non
  ctx.drawImage(img,-tw/2,-th,tw,th);
  ctx.restore();
}


// ombre portee elliptique au sol sous un element
function shadow(cx,cyB,w,a){
  // ombre douce et compacte : sous le pied, pas trop grande -> du relief sans grosse tache
  // a (optionnel) = multiplicateur d'opacite 0..1 -> l'ombre fond avec l'objet qui s'estompe
  ctx.save();
  ctx.globalAlpha=0.30*(a==null?1:a);ctx.fillStyle='#16210d';
  ctx.beginPath();ctx.ellipse(cx,cyB,w*0.38,w*0.15,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
// alpha de FONDU d'un gros objet (arbre/batiment) qui masque un champ en zoom : null = pas de fondu, sinon 0..0.4
function fadeA(x,y,t,ix,iy){
  if(!(isBig(t)&&zoom>0.9))return null;
  for(const kk in cropCells){const c=cropCells[kk];
    if((x+y)>(c.x+c.y)&&Math.abs(isoX(c.x+.5,c.y+.5)-ix)<TW()*1.1&&isoY(c.x+.5,c.y+.5)>iy-TH()*4&&isoY(c.x+.5,c.y+.5)<iy+TH()*1.2)return Math.max(0,Math.min(0.4,(1.42-zoom)));}
  return null;
}
function decImg(d){const[t,v]=d;if(['tree','treeC','bush','bushF','flower','rock','stump'].includes(t))return t+v;return t;}
// Calibrage des dioramas home_1..11 (mesure du contenu réel des PNG — tous pleine largeur, mais
// l'équateur du socle varie de 147 à 217px du bas). sc : largeur du socle constante (réf home_6) ;
// oy : offset vertical (fraction de TH, + = descend) pour poser le socle au même niveau partout
// (home_4 a ~43px de marge transparente sous le socle -> gros oy).
const HOME_SC=[
  {sc:4.62,oy: 0.25},{sc:4.63,oy:-0.11},{sc:4.62,oy: 0.00},{sc:4.60,oy: 0.72},
  {sc:4.60,oy: 0.03},{sc:4.60,oy: 0.00},{sc:4.62,oy: 0.16},{sc:4.60,oy:-0.05},
  {sc:4.60,oy: 0.41},{sc:4.60,oy:-0.23},{sc:4.70,oy: 0.06}];
function decYOff(t){return 0.85+(t.startsWith('home_')?HOME_SC[(+t.slice(5))-1].oy:0);}   // ancre verticale — seuls les home_* sont calibrés
function decScale(t){if(t.startsWith('rocriv'))return 6.0;if(t.startsWith('pont'))return 3.2;if(t==='pond_big'||t==='pond_mare'||t==='cascade')return 2.6;if(t==='house5')return 1.35;if(['house1','house2','house3','house4','cabin','atelier1'].includes(t))return 2.2;if(t.startsWith('serre'))return 2.0;if(t==='watertower')return 1.6;if(t==='forge')return 1.5;if(t==='well')return 1.0;if(t==='fountain')return 1.1;if(t==='tree'||t==='treeC')return 1.5;if(t==='rock')return 1.1;
  if(t.startsWith('home_'))return HOME_SC[(+t.slice(5))-1].sc;   // maison de James : échelle calibrée par niveau (largeur du socle constante)
  if(t==='lamp')return 0.7;   // mobilier de l'esplanade (les lanternes de champ fieldDeco ont leur sc:0.6 explicite)
  if(t==='arch')return 1.5;
  if(t==='bench')return 0.65;
  if(t==='planter')return 0.6;
  if(t==='potflower'||t==='potplant')return 0.5;
  if(t==='barrel')return 0.55;
  return 0.95;}
function isBig(t){return t.startsWith('house')||t.startsWith('serre')||t==='tree'||t==='treeC'||t==='cabin'||t==='atelier1'||t==='watertower'||t==='forge';}   // home_* volontairement EXCLU -> la maison de James ne s'estompe jamais
function clampCam(){
  const xs=[isoX(0,0)-cam.x,isoX(MW,0)-cam.x,isoX(0,MH)-cam.x,isoX(MW,MH)-cam.x];
  const ys=[isoYb(0,0)-cam.y,isoYb(MW,0)-cam.y,isoYb(0,MH)-cam.y,isoYb(MW,MH)-cam.y];
  const wm=Math.min(...xs),wM=Math.max(...xs),hm=Math.min(...ys)-2*EH(),hM=Math.max(...ys);
  const maxX=-wm,minX=APP_W-wM,maxY=-hm,minY=APP_H-hM;
  cam.x=minX<maxX?Math.min(maxX,Math.max(minX,cam.x)):(maxX+minX)/2;
  cam.y=minY<maxY?Math.min(maxY,Math.max(minY,cam.y)):(maxY+minY)/2;
}
(function(){const cx=MW/2,cy=MH/2;cam.x=-(cx-cy)*TW()/2;cam.y=APP_H*0.5-APP_H*0.28-(cx+cy)*TH()/2;clampCam();})();
function vis(x,y){const sx=isoX(x+0.5,y+0.5),sy=isoY(x+0.5,y+0.5);return sx>-TW()*3&&sx<APP_W+TW()*3&&sy>-TH()*12&&sy<APP_H+TH()*6;}

function groundKey(g){return g==='path'?'sq_path':g==='grass'?'sq_grass':g==='dirt'?'sq_dirt':g==='sand'?'sq_sand':g==='moss'?'sq_moss':g==='gravel'?'sq_gravel':g==='pavel'?'sq_stone':g==='soil'?'sq_soil':g==='mud'?'sq_mud':g==='water'?'sq_grass':'sq_grass';}

function zoneCost(){const o=W.cropzones.filter(z=>z.owned).length;return Math.floor(300*Math.pow(1.7,o-1)*homeZoneDiscount());}
// une parcelle n'est visible/achetable que si sa clairiere (landgroup) est defrichee
function zoneAvailable(z){if(z.bonus)return totalHarvest>=z.palier;if(z.group==null||z.group<0)return true;const g=W.landgroups&&W.landgroups[z.group];return !!(g&&g.owned);}

function draw(){
  ctx.clearRect(0,0,APP_W,APP_H);
  // tri de toutes les cases par profondeur (c+r), avec hauteur prise en compte dans le rendu
  const cells=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(vis(x,y))cells.push({x,y,d:x+y});}
  cells.sort((a,b)=>a.d-b.d);
    for(const {x,y} of cells){
    // 1) parois sous la case
    walls(x,y);
    // 2) sol (ou rampe)
    const rk=W.ramps[y][x];
    if(rk){
      tile(groundKey(W.ground[y][x]),x,y);
      const img=IMG['ramp_'+rk]||IMG[rk];
      const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      const w=TW()*1.55,hh=(img&&img.naturalWidth?img.naturalHeight/img.naturalWidth:0.8)*w;
      // calage specifique selon l'orientation de la rampe
      // stoneNE descend vers SW (gauche), stoneNW descend vers SE (droite)
      let offX=0, offY=0;
      if(rk==='stoneNE'){ offX=-TW()*0.18; offY=EH()*0.10; }      // gauche: ok, leger ajust
      else if(rk==='stoneNW'){ offX=TW()*0.18; offY=-EH()*0.30; } // droite: remonter moins (etait trop haute)
      if(img)ctx.drawImage(img, ix-w/2+offX, iy+TH()*0.5-hh+offY, w, hh);
    } else {
      const g=W.ground[y][x];
      tile(groundKey(g),x,y);
      if(g==='water'){const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5),w=TW()*1.35,hh=TH()*1.35;
      const T=performance.now()/1000;
      ctx.save();ctx.beginPath();ctx.moveTo(ix,iy-hh/2);ctx.lineTo(ix+w/2,iy);ctx.lineTo(ix,iy+hh/2);ctx.lineTo(ix-w/2,iy);ctx.closePath();ctx.clip();
      // 1) degrade de profondeur : turquoise clair en haut -> bleu profond en bas
      const grd=ctx.createLinearGradient(ix,iy-hh/2,ix,iy+hh/2);
      grd.addColorStop(0,'#3f9d92');grd.addColorStop(0.5,'#236b62');grd.addColorStop(1,'#123f3b');
      ctx.fillStyle=grd;ctx.fillRect(ix-w,iy-hh*2,w*2,hh*4);
      // 2) ANIMATION : cycle des 4 frames d'eau avec fondu enchaine -> surface qui ondule en continu
      const fps=2.2;                      // vitesse du cycle (frames/sec)
      const cellPhase=((x*7+y*13)%10)/10; // decalage par case -> casse la repetition du motif
      const fT=T*fps+cellPhase;
      const cur=Math.floor(fT)%4, nxt=(cur+1)%4, blend=fT-Math.floor(fT);
      const f1=IMG['water_f'+cur], f2=IMG['water_f'+nxt];
      // leger decalage de la texture par case (variation spatiale du motif)
      const ox=((x*37+y*19)%24)-12, oy=((x*23+y*41)%24)-12;
      const dw=w*1.5,dh=hh*1.5,dx=ix-w*0.75+ox,dy=iy-hh*0.75+oy;
      if(f1&&f1.complete&&f1.naturalWidth){ctx.globalAlpha=0.78;ctx.drawImage(f1,dx,dy,dw,dh);}
      if(f2&&f2.complete&&f2.naturalWidth){ctx.globalAlpha=0.78*blend;ctx.drawImage(f2,dx,dy,dw,dh);}
      ctx.globalAlpha=1;
      ctx.restore();}
    }
    }
  // PASSE EAU : APRES le sol, AVANT ombres/objets -> mares/lacs poses sur le sol
  // et TOUJOURS sous les arbres/batiments (dessines ensuite dans la passe objets).
  for(const {x,y} of cells){
    const dec=W.decor[y][x];
    if(dec && ['pond_big','pond_mare','cascade'].includes(dec[0])){
      const t=dec[0],img=decImg(dec),sc=decScale(t);const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      drawSp(IMG[img],ix,iy+TH()*0.85,TW()*sc);}
  }
  // PASSE OMBRES : APRES tout le sol, AVANT les objets -> l'ombre se pose sur le terrain
  for(const {x,y} of cells){
    const dec=W.decor[y][x];
    if(dec && ['tree','treeC'].includes(dec[0])){const t=dec[0],sc=decScale(t);const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      const a=fadeA(x,y,t,ix,iy);   // l'ombre fond avec l'arbre estompe (a=0.4 -> pleine, a=0 -> invisible)
      if(a===null)shadow(ix,iy+TH()*0.58,TW()*sc*0.85);
      else if(a>0.01)shadow(ix,iy+TH()*0.58,TW()*sc*0.85,a/0.4);}
  }
  // DECO CHAMP : une lanterne aux 4 coins de chaque parcelle owned -> encadre joliment (PAS de cadre pierre).
  // Dessinees dans la passe crop a la profondeur de leur case-coin (coin Nord derriere les plants, Sud devant).
  const fieldDeco={};
  const fdOK=(x,y)=>Math.max(Math.abs(x-HOME_POS.x),Math.abs(y-HOME_POS.y))>4;   // pas de lanterne de champ collée à l'esplanade
  for(const z of W.cropzones){if(!z.owned)continue;const x0=z.zx,y0=z.zy,x1=z.zx+z.n-1,y1=z.zy+z.n-1;
    if(fdOK(x0,y0))fieldDeco[x0+','+y0]={sp:'lamp',ux:0,uy:-1,front:false,sc:0.6};    // coin Nord (arriere) : lanterne
    if(fdOK(x1,y0))fieldDeco[x1+','+y0]={sp:'lamp',ux:1,uy:0,front:false,sc:0.6};     // coin Est : lanterne
    if(fdOK(x0,y1))fieldDeco[x0+','+y1]={sp:'lamp',ux:-1,uy:0,front:false,sc:0.6};}   // coin Ouest : lanterne (coin Sud laisse ouvert)
  // OUVRIERS : position interpolée -> indexés par case arrondie, dessinés à la profondeur de leur case
  const nowW=performance.now(), wkByCell={};
  for(const w of workers){const p=workerPos(w,nowW);
    const k=Math.round(p.x)+','+Math.round(p.y);(wkByCell[k]=wkByCell[k]||[]).push({w,p});}
  // PASSE OBJETS
  for(const {x,y} of cells){
    const dec=W.decor[y][x];
    if(dec && !['pond_big','pond_mare','cascade'].includes(dec[0])){const t=dec[0],img=decImg(dec),sc=decScale(t);const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      // FONDU : un gros objet (arbre/bâtiment) qui MASQUE un champ cultivable en zoom
      // -> on l'estompe (faible opacité) + on le floute, pour voir les parcelles derrière.
      let a=fadeA(x,y,t,ix,iy);   // fondu partage avec la passe ombres
      const wind=['tree','treeC','bush','bushF','flower'].includes(t);
      if(a!=null){                                               // masque un champ -> estompé+flou, ou INVISIBLE si trop proche (a~0)
        if(a>0.03){ctx.save();ctx.filter='blur(3px)';drawSp(IMG[img],ix,iy+TH()*0.85,TW()*sc,a);ctx.restore();}
      } else if(wind){
        const amp=(t==='flower'?0.10:t==='bush'||t==='bushF'?0.055:0.035); // fleurs souples, arbres raides
        drawSpWind(IMG[img],ix,iy+TH()*0.62,TW()*sc,amp,(x*1.3+y*0.7));
      } else {
        drawSp(IMG[img],ix,iy+TH()*decYOff(t),TW()*sc,null);
      }
      // halo chaud pulsant des lampadaires de l'esplanade (pattern du halo des plants ready — perf prouvée)
      if(t==='lamp'){const pl=0.8+0.2*Math.sin(performance.now()/900+(x*2.1+y*3.7));
        const gy=iy+TH()*0.85-TW()*sc*1.68*0.78, R=TW()*0.55;
        const gg=ctx.createRadialGradient(ix,gy,R*0.08,ix,gy,R);
        gg.addColorStop(0,'rgba(255,214,120,'+(0.30*pl)+')');
        gg.addColorStop(0.55,'rgba(255,190,90,'+(0.10*pl)+')');
        gg.addColorStop(1,'rgba(255,190,90,0)');
        ctx.fillStyle=gg;ctx.beginPath();ctx.arc(ix,gy,R,0,7);ctx.fill();}}
    // 4) crop
    const ck=x+','+y;if(cropCells[ck]){const c=cropCells[ck];const ix=isoX(x+0.5,y+0.5),iy=isoY(x+0.5,y+0.5);
      // TERRE LABOUREE a sillons : sprite 'parc' complet par case (bordure bois incluse, ratio 0.605),
      // mappe exactement sur le losange de la tuile -> pave parfaitement, zero chevauchement. (NE PAS clipper.)
      let pk=c.state==='growing'?(c.grow<0.15?'parc3':'parc2'):c.state==='ready'?'parc4':'parc1';
      {const pimg=IMG[pk];if(pimg&&pimg.complete&&pimg.naturalWidth){const dw=TW()*1.04,dh=TH()*1.04;ctx.drawImage(pimg,ix-dw/2,iy-dh/2,dw,dh);}}
      // lanterne de coin ARRIERE (Nord/Est/Ouest) : posee AVANT les plants -> derriere eux
      const fd=fieldDeco[ck];
      if(fd&&!fd.front){const lp=IMG[fd.sp];if(lp&&lp.naturalWidth)drawSp(lp,ix+fd.ux*TW()/2,iy+fd.uy*TH()/2,TW()*fd.sc,null);}
      // surbrillance de la case selectionnee (cadre lumineux pulse + animation)
      if(selCell===c){const w=TW(),hh=TH(),cyS=iy;const pulse=0.5+0.5*Math.sin(performance.now()/300);
        ctx.save();ctx.beginPath();ctx.moveTo(ix,cyS-hh/2);ctx.lineTo(ix+w/2,cyS);ctx.lineTo(ix,cyS+hh/2);ctx.lineTo(ix-w/2,cyS);ctx.closePath();
        ctx.fillStyle='rgba(157,255,184,'+(0.12+0.12*pulse)+')';ctx.fill();
        ctx.lineWidth=2.5;ctx.strokeStyle='rgba(157,255,184,'+(0.6+0.4*pulse)+')';ctx.stroke();ctx.restore();
        // petits carrés qui montent et disparaissent + jolies particules flottantes
        const tt=performance.now();ctx.save();
        for(let k=0;k<5;k++){const ph=((tt/1300)+k/5)%1;
          const sxq=ix+((k+0.5)/5-0.5)*w*0.78, syq=cyS+hh*0.35-ph*(hh*0.5+TH()*1.7);
          const sz=Math.max(2,TW()*0.055*(1-ph*0.35));ctx.globalAlpha=Math.sin(ph*Math.PI)*0.75;ctx.fillStyle='#9dffb8';
          ctx.save();ctx.translate(sxq,syq);ctx.rotate(ph*1.4);ctx.fillRect(-sz/2,-sz/2,sz,sz);ctx.restore();}
        for(let k=0;k<7;k++){const ph=((tt/2600)+k/7)%1;
          const px=ix+Math.sin(k*2.1)*w*0.42+Math.sin(tt/850+k)*TW()*0.06, py=cyS+hh*0.3-ph*(hh*0.5+TH()*1.4);

// caméra interpolée : glisse le CENTRE écran vers la case (tx,ty) au zoom tz en ms — réutilisable pour d'autres cinématiques
function glideCam(tx,ty,tz,ms,done){
  const z0=zoom, s0=-cam.x/(TW()/2), a0=(APP_H*0.5-APP_H*0.28-cam.y)/(TH()/2);   // (c-r) et (c+r) du point monde au centre écran
  const c0=(a0+s0)/2, r0=(a0-s0)/2, t0=performance.now();
  (function step(){
    const k=Math.min(1,(performance.now()-t0)/ms), e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;   // ease in-out
    zoom=z0+(tz-z0)*e;
    const c=c0+(tx-c0)*e, r=r0+(ty-r0)*e;
    cam.x=-(c-r)*TW()/2; cam.y=APP_H*0.5-APP_H*0.28-(c+r)*TH()/2; clampCam();
    if(k<1)requestAnimationFrame(step);else if(done)done();
  })();}

function pickCrop(px,py){let b=null,bd=1e9;for(const k in cropCells){const c=cropCells[k];const x=isoX(c.x+.5,c.y+.5),y=isoY(c.x+.5,c.y+.5)+TH()*.5;const d=Math.abs(px-x)/(TW()*.55)+Math.abs(py-y)/(TH()*.55);if(d<=1&&d<bd){bd=d;b=c;}}return b;}

function pointInQuad(px,py,q){let s=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];const cr=(b[0]-a[0])*(py-a[1])-(b[1]-a[1])*(px-a[0]);const sg=cr>0?1:cr<0?-1:0;if(sg){if(s&&sg!==s)return false;s=sg;}}return true;}
function groupQuad(g){return [[isoX(g.gx,g.gy),isoY(g.gx,g.gy)],[isoX(g.gx+g.gw,g.gy),isoY(g.gx+g.gw,g.gy)],[isoX(g.gx+g.gw,g.gy+g.gh),isoY(g.gx+g.gw,g.gy+g.gh)],[isoX(g.gx,g.gy+g.gh),isoY(g.gx,g.gy+g.gh)]];}
function pickLandGroup(px,py){if(!W.landgroups)return null;for(const g of W.landgroups){if(g.owned)continue;if(pointInQuad(px,py,groupQuad(g)))return g;}return null;}

function applyClearing(gi){const g=W.landgroups&&W.landgroups[gi];if(!g)return;const CUT=['tree','treeC','bush','bushF','flower','stump'];
  for(let y=g.gy;y<g.gy+g.gh;y++)for(let x=g.gx;x<g.gx+g.gw;x++){
    if(x<0||y<0||x>=MW||y>=MH)continue;const d=W.decor[y][x];
    if(d&&CUT.includes(d[0]))W.decor[y][x]=null;}
  for(const z of W.cropzones){if(z.group!==gi)continue;
    for(let dy=0;dy<z.n;dy++)for(let dx=0;dx<z.n;dx++){const x=z.zx+dx,y=z.zy+dy;if(x<0||y<0||x>=MW||y>=MH)continue;
      if(W.decor[y][x]&&W.decor[y][x][0]==='rock')W.decor[y][x]=null;
      W.ground[y][x]='soil';}}
}

// TACTILE robuste : re-cale le glissement à CHAQUE changement de nb de doigts (fini le saut)
cv.addEventListener('touchstart',e=>{e.preventDefault();
  if(e.touches.length>=2){pinch={d:dist(e.touches),z:zoom};ds=null;}            // pinch -> pas de pan périmé
  else{ds=xy(e);cs={...cam};dm=false;pinch=null;}
},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  if(e.touches.length>=2){                                                      // ZOOM 2 doigts (ancré au milieu)
    if(!pinch)pinch={d:dist(e.touches),z:zoom};
    const m=midXY(e);zoomAt(pinch.z*dist(e.touches)/pinch.d,m[0],m[1]);return;
  }
  const[x,y]=xy(e);
  if(!ds){ds=[x,y];cs={...cam};dm=true;return;}                                 // sortie de pinch : recale, aucun saut
  if(Math.abs(x-ds[0])+Math.abs(y-ds[1])>10)dm=true;
  cam.x=cs.x+x-ds[0];cam.y=cs.y+y-ds[1];clampCam();
},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();
  if(e.touches.length>=2){pinch={d:dist(e.touches),z:zoom};ds=null;return;}     // encore un pinch -> re-baseline
  if(e.touches.length===1){pinch=null;ds=xy(e);cs={...cam};dm=true;return;}     // 1 doigt restant -> recale le pan (pas de tap)
  if(pinch){pinch=null;ds=null;return;}                                         // 0 doigt, sortie de pinch
  if(!dm&&ds)onTap(ds[0],ds[1]);                                                // 0 doigt -> tap si pas de glissement
  ds=null;
},{passive:false});
cv.addEventListener('mousedown',e=>{ds=xy(e);cs={...cam};dm=false;md=true;});cv.addEventListener('mousemove',e=>{if(!md)return;const[x,y]=xy(e);if(Math.abs(x-ds[0])+Math.abs(y-ds[1])>10)dm=true;cam.x=cs.x+x-ds[0];cam.y=cs.y+y-ds[1];clampCam();});cv.addEventListener('mouseup',e=>{if(!dm&&ds)onTap(ds[0],ds[1]);ds=null;md=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();const m=xy(e);zoomAt(zoom*(e.deltaY<0?1.1:.9),m[0],m[1]);},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(zoom*1.2,APP_W/2,APP_H/2);document.getElementById('zout').onclick=()=>zoomAt(zoom/1.2,APP_W/2,APP_H/2);
// ===== FONDATIONS IDLE : temps réel, sauvegarde, offline, régén des soins =====
function growCells(ms){let became=0;for(const k in cropCells){const c=cropCells[k];if(c.state==='growing'){c.grow+=ms/(GROW_MS*speedMult());if(c.grow>=1){c.grow=1;c.state='ready';became++;}}}return became;}
function regenCare(now){const iv=CARE_REFILL_MS/homeCareRegenMult();const n=Math.floor((now-careT)/iv);if(n<=0)return;for(const t in CARE_MAX)boosts[t]=Math.min(careMax(t),boosts[t]+n);careT+=n*iv;updateCareUI();}
function save(){try{
  const crops={};for(const k in cropCells){const c=cropCells[k];if(c.state!=='empty')crops[k]={s:c.state,g:c.grow,vv:c.variety,w:c.water||0,su:c.sun||0,n:c.nute||0,q:c.quality||1};}
  const zones=[];W.cropzones.forEach((z,i)=>{if(z.owned)zones.push(i);});
  const land=[];(W.landgroups||[]).forEach((g,i)=>{if(g.owned)land.push(i);});
  localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,t:Date.now(),coin,stock,marketPrice,totalHarvest,houseLevel,boosts,careT,lab,wk:{n:workerCount,up:wkUp},mi,st:stats,zones,land,crops}));
}catch(e){}}
function load(){let s;try{s=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){s=null;}
  if(!s||s.v!==1)return;
  setCoin(s.coin);stock=s.stock;marketPrice=s.marketPrice;totalHarvest=s.totalHarvest||0;
  houseLevel=s.houseLevel||1;placeHome();   // re-pose la maison au bon niveau
  if(s.boosts)boosts=s.boosts; if(s.lab)lab=s.lab; careT=s.careT||Date.now();
  if(s.wk){workerCount=Math.min(WK_CFG.MAX,s.wk.n||0);if(s.wk.up)wkUp={walk:0,dex:0,night:0,...s.wk.up};}   // vieux saves sans wk -> 0 ouvrier
  mi=Math.min(s.mi||0,MISSIONS.length);if(s.st)stats={...stats,...s.st};   // vieux saves sans missions -> chaîne rétro-claimable
  if(W.landgroups&&s.land)for(const gi of s.land){if(W.landgroups[gi]){W.landgroups[gi].owned=true;applyClearing(gi);}}
  if(s.zones)for(const zi of s.zones){const z=W.cropzones[zi];if(z){z.owned=true;if(z.bonus)clearZoneLand(z);}}   // re-dégage le décor des parcelles bonus achetées
  unlockedShown=W.cropzones.filter(z=>z.bonus&&totalHarvest>=z.palier).length;   // ne pas re-toaster au retour
  rebuildCrop();
  if(s.crops)for(const k in s.crops){const c=cropCells[k];if(c){const d=s.crops[k];c.state=d.s;c.grow=d.g;c.variety=d.vv;c.water=d.w;c.sun=d.su;c.nute=d.n;c.quality=d.q;}}
  const off=Math.min(Math.max(0,Date.now()-(s.t||Date.now())),homeOfflineH()*3600*1000);   // OFFLINE (capé : 8h base + lits de la maison ; horloge reculée -> 0)
  if(off>0)growCells(off);
  const wkG=wkOfflineGains(off);   // rendement des ouvriers pendant l'absence (analytique, ne double-compte pas growCells)
  if(wkG>0){stock+=wkG;totalHarvest+=wkG;checkPaliers();}   // un palier franchi pendant la nuit s'annonce
  for(let i=0;i<workerCount;i++)spawnWorker(i);             // runtime : ils reprennent le boulot depuis la maison
  regenCare(Date.now());
  updateStock();updateCareUI();updateHomeBadge();updateWkBtn();
  let rc=0;for(const k in cropCells)if(cropCells[k].state==='ready')rc++;
  if(off>60000&&rc>0)setTimeout(()=>toast('Bon retour ! 🌿 '+rc+' plant'+(rc>1?'s':'')+' prêt'+(rc>1?'s':'')+' à récolter'),700);
  if(wkG>0)setTimeout(()=>toast('👷 Tes ouvriers ont récolté '+money(wkG)+' g !'),2600);   // séquencé après le « Bon retour »
  const m0=curMission();   // mission déjà accomplie au retour -> rappel différé (après les autres toasts), sans re-toaster ensuite
  if(m0&&missionDone(m0)){_mNotif=true;setTimeout(()=>banner('🎯 Mission accomplie — réclame ta récompense !',true),4400);}
}
load(); updateMissionUI(); lastTick=Date.now();
setInterval(()=>{const now=Date.now();const dt=Math.min(now-lastTick,5000);lastTick=now;growCells(dt);regenCare(now);updateWorkers(performance.now());updateMissionUI();},200);
setInterval(save,10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);
window.__wipe=()=>{localStorage.removeItem(SAVE_KEY);location.reload();};
</script></body></html>
